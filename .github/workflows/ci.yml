name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Verify the SDK feature band
        shell: pwsh
        run: ./eng/Test-SdkBand.ps1
      - name: Restore
        run: dotnet restore OmniEurope.Blazor.slnx --locked-mode
      - name: Build
        run: dotnet build OmniEurope.Blazor.slnx --configuration Release --no-restore
      - name: Publish Server catalog
        run: dotnet publish samples/OmniEurope.Blazor.Catalog/OmniEurope.Blazor.Catalog.csproj --configuration Release --no-restore --output artifacts/catalog-smoke
      - name: Server catalog smoke test
        shell: pwsh
        run: ./eng/Test-CatalogHost.ps1
      - name: Publish WebAssembly smoke host
        run: dotnet publish samples/OmniEurope.Blazor.WasmSmoke/OmniEurope.Blazor.WasmSmoke.csproj --configuration Release --no-restore --output artifacts/wasm-smoke
      - name: WebAssembly deployment headers
        shell: pwsh
        run: ./eng/Test-WasmHeaders.ps1
      - name: WebAssembly browser smoke test
        shell: pwsh
        run: ./eng/Test-WasmHost.ps1
      - name: Publish Interactive Auto smoke host
        run: dotnet publish samples/OmniEurope.Blazor.AutoSmoke/OmniEurope.Blazor.AutoSmoke.csproj --configuration Release --no-restore --output artifacts/auto-smoke
      - name: Interactive Auto smoke test
        shell: pwsh
        run: ./eng/Test-AutoHost.ps1
      - name: Unit tests and coverage
        run: dotnet test tests/OmniEurope.Blazor.Tests/OmniEurope.Blazor.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=tests.trx" --results-directory artifacts/coverage
      - name: Verify coverage artifact
        shell: pwsh
        run: ./eng/Test-Coverage.ps1 -CoverageRoot artifacts/coverage
      - name: Dependency and action policy
        shell: pwsh
        run: ./eng/Test-DependencyPolicy.ps1
      - name: SBOM and license registry
        shell: pwsh
        run: |
          ./eng/Generate-Sbom.ps1
          ./eng/Test-Sbom.ps1
          git diff --exit-code -- NOTICE.md docs/sbom.cdx.json docs/third-party-packages.json docs/third-party-licenses
      - name: CSP source guard
        shell: pwsh
        run: |
          ./eng/Test-CspFixtures.ps1
          ./eng/Test-Csp.ps1
      - name: Coverage registry guard
        shell: pwsh
        run: |
          ./eng/Generate-ComponentCoverage.ps1
          git diff --exit-code -- docs/component-coverage.json docs/component-coverage.md
      - name: Public API guard
        shell: pwsh
        run: ./eng/Test-PublicApi.ps1
      - name: Artifact budgets
        shell: pwsh
        run: ./eng/Test-Budgets.ps1
      - name: Pack
        run: dotnet pack src/OmniEurope.Blazor/OmniEurope.Blazor.csproj --configuration Release --no-build --output artifacts/packages
      - name: Package content and size
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/packages/*.nupkg | Where-Object Name -NotLike '*.snupkg' | Select-Object -First 1
          $symbols = Get-ChildItem artifacts/packages/*.snupkg | Select-Object -First 1
          ./eng/Test-Package.ps1 -PackagePath $package.FullName -SymbolPackagePath $symbols.FullName
          ./eng/Test-PackageFixtures.ps1 -PackagePath $package.FullName
          ./eng/Test-Budgets.ps1 -PackagePath $package.FullName
      - name: Record validated package provenance
        shell: pwsh
        run: |
          ./eng/New-PackageProvenance.ps1 -PackageDirectory artifacts/packages -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT
          ./eng/Test-PackageProvenance.ps1 -PackageDirectory artifacts/packages -ExpectedCommit $env:GITHUB_SHA -ExpectedRepository $env:GITHUB_REPOSITORY -ExpectedRunId $env:GITHUB_RUN_ID -ExpectedRunAttempt $env:GITHUB_RUN_ATTEMPT
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nuget-package
          path: artifacts/packages

  hybrid-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Verify the SDK feature band
        shell: pwsh
        run: ./eng/Test-SdkBand.ps1
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows
      - name: Record the resolved SDK and workload set
        run: |
          dotnet --version
          dotnet workload --version
      - name: Restore Hybrid smoke host
        run: dotnet restore samples/OmniEurope.Blazor.HybridSmoke/OmniEurope.Blazor.HybridSmoke.csproj --locked-mode
      - name: Build Hybrid smoke host
        run: dotnet build samples/OmniEurope.Blazor.HybridSmoke/OmniEurope.Blazor.HybridSmoke.csproj --configuration Release
      - name: Hybrid WebView2 smoke test
        shell: pwsh
        run: ./eng/Test-HybridHost.ps1

