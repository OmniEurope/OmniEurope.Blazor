name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore OmniEurope.Blazor.slnx --locked-mode
      - name: Build
        run: dotnet build OmniEurope.Blazor.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test OmniEurope.Blazor.slnx --configuration Release --no-build
      - name: CSP source guard
        shell: pwsh
        run: ./eng/Test-Csp.ps1
      - name: Pack
        run: dotnet pack src/OmniEurope.Blazor/OmniEurope.Blazor.csproj --configuration Release --no-build --output artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/packages/*.*nupkg

