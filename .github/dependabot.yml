# Version guard (STD-SDKPIN): one PR per newer version, never a build failure.
# Kit model (_Generic .github/dependabot.yml) without the docker ecosystem: this repository ships
# no container image. A dotnet-sdk PR proposes moving the global.json floor (latestFeature already
# accepts later bands, ADR-002); a nuget PR must also update eng/dependency-policy.json, which
# eng/Test-DependencyPolicy.ps1 checks.
version: 2
updates:
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "sdk"]
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies", "nuget"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # STD-SDKPIN (ADR-002): the three Microsoft.CodeAnalysis packages follow the compiler of the
    # global.json SDK floor, never the latest release. An analyzer built against a newer Roslyn than
    # the loading SDK fails with CS9057 in every project that references this repository. They are
    # the only packages excluded from updates; moving them is a deliberate commit with the floor.
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
      - dependency-name: "Microsoft.CodeAnalysis.Workspaces.Common"
