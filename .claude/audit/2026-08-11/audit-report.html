  {dim:"conventions",sev:"low",status:"finding",id:"A360-291",file:"eng/Generate-RadzenSurfaceInventory.ps1:111-143-",module:"Repository",size:"",text:"Les libellés générés contiennent des caractères non ASCII dans un fichier PowerShell, en violation de la règle ASCII du kit - lignes 111-143 - source: <code>coding-standards.md</code> du kit - recommandation: Codex peut externaliser les textes humains UTF-8 et maintenir uniquement des identifiants et messages techniques ASCII dans le script, puis automatiser ce contrôle."},
  {dim:"conventions",sev:"low",status:"finding",id:"A360-292",file:"eng/Test-AutoHost.ps1:24,41,53-71",module:"Repository",size:"",text:"Les messages du script PowerShell contiennent des accents et signes non ASCII malgré la règle ASCII du kit - lignes 24, 41, 53-71 et 81 - source: <code>coding-standards.md</code> du kit - recommandation: Codex peut translittérer les messages techniques ou les externaliser dans une ressource UTF-8 et ajouter un contrôle ASCII pour <code>eng/*.ps1</code>."},
  {dim:"conventions",sev:"low",status:"finding",id:"A360-293",file:"eng/Test-CatalogHost.ps1:24,41,55-74",module:"Repository",size:"",text:"Les messages du script PowerShell contiennent des caractères non ASCII contrairement à la règle du kit - lignes 24, 41, 55-74 et 84 - source: <code>coding-standards.md</code> du kit - recommandation: Codex peut translittérer ou externaliser les libellés et automatiser la vérification ASCII des scripts."},
  {dim:"conventions",sev:"low",status:"finding",id:"A360-294",file:"LICENSE:116",module:"Repository",size:"",text:"Le texte légal officiel contient deux tirets cadratins U+2014, alors que le contrôle typographique du workflow les interdit globalement; une correction mécanique risquerait toutefois d'altérer le texte de référence de l'EUPL - lignes 116 et 278 - source: scan U+2014 exhaustif des 58 fichiers - recommandation: Codex peut borner explicitement l'exception au fichier <code>LICENSE</code> après comparaison avec la version officielle EUPL-1.2, puis faire échouer la gate U+2014 partout ailleurs sans réécrire le texte légal."},
  {dim:"docs",sev:"medium",status:"finding",id:"A360-295",file:".claude/audit/2026-08-11/artefacts/AUDIT_KIT.md:145",size:"",text:"<code>CLAUDE.md</code> et le paquet documentaire canonique sont incomplets. <code>CLAUDE.md</code> ne contient que la reprise de session; il manque la table de documentation, la stack, la structure, les commandes, les règles et les liens vers la gouvernance. Les documents canoniques de stack, patterns, standards, tests, agents, analyseurs et UI sont absents; les décisions sont dispersées, sans ADR. Recommandation: Codex devra transformer les 26 documents existants en carte canonique, créer uniquement les documents de gouvernance manquants qui ont une portée réelle pour la RCL, et consigner les décisions structurantes sous forme d'ADR."},
  {dim:"docs",sev:"medium",status:"finding",id:"A360-296",file:".claude/test-config.md:17-27-",module:"Repository",size:"",text:"La configuration déclare les catégories <code>integration</code> et <code>e2e</code> vides alors que le dépôt possède des sondes d'hôtes, de paquet et de CSP dans <code>eng/</code> et les exécute en CI; <code>/tests</code> ne peut donc ni découvrir ni piloter la stratégie de vérification réelle - lignes 17-27 - source: comparaison avec <code>.github/workflows/ci.yml</code> et <code>eng/Test-*.ps1</code> - recommandation: Codex peut inventorier les gates existantes, classer les tests d'hôte et de paquet en intégration, ajouter la future preuve navigateur à <code>e2e</code>, documenter leurs prérequis et faire valider la configuration par le skill de tests."},
  {dim:"docs",sev:"medium",status:"finding",id:"A360-297",file:"CLAUDE.md:1-5-",module:"Repository",size:"",text:"Le fichier ne contient que la reprise de session et omet la vue d'ensemble, la stack, la structure, les commandes, les règles, la carte des 26 documents et les adaptations de la RCL au kit; la gouvernance effective reste dispersée et l'ambiguïté Radzen/Omni n'est pas résolue - lignes 1-5 - source: <code>AUDIT_KIT.md</code> - recommandation: Codex peut transformer ce fichier en point d'entrée concis vers la documentation canonique, le registre local de règles, les commandes de validation et les décisions architecturales, tout en conservant <code>## Session resume</code>."},
  {dim:"docs",sev:"low",status:"finding",id:"A360-298",file:"README.md:47-49-",module:"Repository",size:"",text:"Le README affirme que le SDK <code>10.0.302</code> est « verrouillé par global.json », alors que <code>rollForward: latestPatch</code> autorise un autre patch <code>10.0.3xx</code>; cette instruction peut produire des environnements différents sous une promesse de verrouillage exact - lignes 47-49 - source: <code>global.json</code> et <code>docs/reproducibility.md</code> - recommandation: Codex peut décrire précisément la bande autorisée et la stratégie workload, ou épingler l'environnement exact retenu puis publier les versions effectives dans la CI."},
  {dim:"authenticity",sev:"high",status:"finding",id:"A360-299",file:"samples/OmniEurope.Blazor.Catalog/Components/Pages/Home.razor:9-13-",module:"Catalog",size:"",text:"Le texte affirme que l'hôte valide les <code>110 capacités inventoriées</code> et affiche <code>110/110</code>, mais le markup ne rend que 36 balises Omni distinctes et la documentation précise que le catalogue n'illustre qu'un sous-ensemble ; la présence de fichiers est présentée comme une validation fonctionnelle - lignes 9-13 - source : <code>docs/component-coverage.md:3-6</code>, <code>docs/component-families.md:21</code> et comptage vérifié du markup avant <code>@code</code> - recommandation : Codex peut remplacer cette affirmation par la métrique exacte de présence, générer une matrice scénario-vers-capacité et n'afficher une couverture comportementale qu'après preuve nominale, erreur et navigateur pour chaque entrée."},
  {dim:"authenticity",sev:"high",status:"finding",id:"A360-300",file:".github/workflows/publish-nuget.yml:20-30-",module:"Repository",size:"",text:"Le workflow de release reconstruit puis publie un paquet distinct sans télécharger l'artefact exact validé par la CI, sans exécuter tests, contrôles API/CSP, inspection de contenu ni preuve de provenance; une release peut donc publier un binaire que les gates annoncées n'ont jamais examiné - lignes 20-30 - source: comparaison avec <code>.github/workflows/ci.yml:20-64</code> et <code>eng/Test-Package.ps1</code> - recommandation: Codex peut faire produire un artefact unique identifié par hash dans la CI, exiger la réussite de toutes les gates, puis limiter ce workflow au téléchargement, à la vérification et à la publication de cet artefact inchangé."},
  {dim:"authenticity",sev:"high",status:"finding",id:"A360-301",file:"docs/component-contracts.json:21,215-303,397,449,547,765,1037,1186,1442-1478,1774,2598-",module:"Repository",size:"",text:"L'inventaire présenté comme des paramètres de composants contient manifestement des identifiants issus d'expressions consommées (<code>FailureCount</code>, <code>ArticleCount</code>, <code>Committee</code>, <code>Decision</code>, <code>DeploymentTargetAvailable</code>, <code>Verdict</code>, plusieurs <code>Count</code> et <code>Status</code>) qui ne sont pas des paramètres Radzen; le parseur regex confond donc syntaxe Razor et contrat public, et aucune provenance par entrée ne permet de corriger ou authentifier les 2 992 lignes - lignes 21, 215-303, 397, 449, 547, 765, 1037, 1186, 1442-1478, 1774, 2598 - source: cohérence interne, <code>.claude/plan.md:23</code> et <code>docs/reproducibility.md</code> - recommandation: Codex peut remplacer l'extraction regex par une analyse Razor/sémantique, conserver pour chaque observation le fichier, la ligne et l'empreinte de l'instantané, ajouter des fixtures négatives sur expressions et régénérer le JSON avant de l'utiliser comme contrat de migration."},
  {dim:"authenticity",sev:"high",status:"finding",id:"A360-302",file:"docs/component-coverage.json:3-5,198-201,348-351,748-751,818-821,918-921-",module:"Repository",size:"",text:"Le registre affirme <code>implemented: 110</code> et <code>planned: 0</code> pour toutes les cibles alors que le statut signifie seulement qu'un fichier Razor de ce nom existe; il classe notamment dialogue, graphiques empilés et éditeur HTML comme implémentés malgré les capacités fonctionnelles explicitement ouvertes dans le plan et l'architecture - lignes 3-5, 198-201, 348-351, 748-751, 818-821, 918-921 - source: <code>.claude/plan.md:52-65,137-176</code>, <code>AUDIT_ARCHITECTURE.md</code> ARCH-01/02 et logique de <code>eng/Generate-ComponentCoverage.ps1</code> - recommandation: Codex peut remplacer le booléen d'existence par une matrice de capacités liant chaque entrée à des tests nominaux et d'erreur, un scénario de catalogue et, lorsqu'il est visuel, une preuve navigateur; la gate doit échouer sur tout lien absent ou incomplet."},
  {dim:"authenticity",sev:"high",status:"finding",id:"A360-303",file:"docs/public-api.txt:1-541-",module:"Repository",size:"",text:"La baseline de 541 signatures omet des catégories entières de l'API réellement publique, notamment les paramètres requis, méthodes, propriétés, constructeurs, interfaces, structs, delegates et contraintes génériques; une rupture dans ces membres peut donc laisser la gate verte et le fichier ne peut pas servir de preuve exhaustive de stabilité - ensemble du fichier, notamment lignes 1-541 - source: limites reconnues dans <code>docs/public-api-conventions.md</code> et logique regex de <code>eng/Test-PublicApi.ps1:20-25</code> - recommandation: Codex peut remplacer la baseline par une extraction Roslyn de symboles publics, couvrir chaque catégorie avec des fixtures positives et négatives, puis régénérer ce fichier dans un format déterministe."},
  {dim:"authenticity",sev:"high",status:"finding",id:"A360-304",file:"docs/radzen-surface-inventory.json:2-496-",module:"Repository",size:"",text:"Le champ <code>symbols</code> mélange usages Radzen et simples identifiants contenant ce préfixe, dont <code>RadzenAssets_AreCacheBustedWithTheReferencedPackageVersion</code>, <code>RadzenButtonIconAuditTests</code>, <code>RadzenLabelAssociationAuditTests</code> et <code>RadzenSanitizer_PreservesNativeHeaderSortState</code>; les 122 symboles et leurs occurrences ne mesurent donc pas la surface API à migrer - lignes 2-496 - source: cohérence interne et regex de <code>eng/Generate-RadzenSurfaceInventory.ps1:34</code> - recommandation: Codex peut analyser les arbres C#/Razor, classifier type, balise, namespace, package et ressource, exclure les identifiants de tests non référents, conserver la provenance par occurrence et régénérer le rapport depuis un corpus manifesté."},
  {dim:"authenticity",sev:"high",status:"finding",id:"A360-305",file:"docs/radzen-surface-inventory.md:3-7,16,25,77",module:"Repository",size:"",text:"Le tableau présente 122 « symboles C#/Razor » alors qu'il contient des noms de tests et d'assertions tels que <code>RadzenAssets_AreCacheBustedWithTheReferencedPackageVersion</code>, <code>RadzenButtonIconAuditTests</code>, <code>RadzenLabelAssociationAuditTests</code> et <code>RadzenSanitizer_PreservesNativeHeaderSortState</code>; les totaux affichés ne représentent donc pas une surface Radzen exploitable pour la migration - lignes 3-7, 16, 25, 77 et 116 - source: JSON voisin et regex de <code>eng/Generate-RadzenSurfaceInventory.ps1:34</code> - recommandation: Codex peut régénérer ce tableau depuis une analyse sémantique classifiée et ne publier comme symboles que les références dont la provenance et la nature sont conservées."},
  {dim:"authenticity",sev:"high",status:"finding",id:"A360-306",file:"eng/Generate-ComponentCoverage.ps1:11-12",module:"Repository",size:"",text:"Le générateur attribue <code>implemented</code> uniquement lorsque le nom d'un fichier <code>Omni*.razor</code> correspond à la cible calculée; il transforme ainsi une présence physique en état d'implémentation pour 110 composants sans vérifier capacité, test, catalogue, interaction ni compatibilité - lignes 11-12 et 50-69 - source: <code>docs/component-coverage.json</code>, <code>AUDIT_ARCHITECTURE.md</code> ARCH-01/02 et plan canonique - recommandation: Codex peut remplacer cette déduction par une matrice versionnée de capacités avec liens vers tests exécutables, états de catalogue et preuves navigateur, et faire échouer la génération lorsque toute preuve obligatoire manque."},
  {dim:"authenticity",sev:"high",status:"finding",id:"A360-307",file:"eng/Generate-RadzenSurfaceInventory.ps1:34-39",module:"Repository",size:"",text:"La regex <code>Radzen[A-Z][A-Za-z0-9_]*</code> compte toute sous-chaîne lexicale comme symbole, y compris des noms de tests, méthodes et assertions, tandis que le parseur d'attributs Razor confond des expressions avec des paramètres; les deux rapports de surface et de contrats peuvent donc fabriquer des preuves de migration - lignes 34-39 et 56-75 - source: faux positifs observables dans les JSON générés - recommandation: Codex peut remplacer ces regex par des parseurs C# et Razor, classifier les références, conserver fichier/ligne/hash par occurrence et couvrir les faux positifs actuels par des fixtures négatives."},
  {dim:"authenticity",sev:"high",status:"finding",id:"A360-308",file:"eng/Test-CatalogHost.ps1:38-63",module:"Repository",size:"",text:"La prétendue preuve de « zéro violation » interroge la page par HTTP puis consulte <code>/csp-status</code> sans charger ni exercer le catalogue dans un navigateur; aucun script, composant interactif ou rapport CSP client n'a donc pu s'exécuter, et un collecteur vide passe mécaniquement - lignes 38-63 et 74 - source: <code>docs/reproducibility.md</code> et plan canonique phase 13 - recommandation: Codex peut remplacer cette gate par un scénario Playwright qui navigue chaque famille, exerce les interactions critiques, collecte <code>securitypolicyviolation</code> et rapports serveur, puis échoue sur toute violation avec traces archivées."},
  {dim:"authenticity",sev:"high",status:"finding",id:"A360-309",file:"eng/Test-Package.ps1:12-35",module:"Repository",size:"",text:"L'absence de Radzen n'est vérifiée que dans les noms d'entrées ZIP et le <code>.nuspec</code>; le contenu de la DLL, du PDB, du CSS et du JavaScript n'est jamais inspecté, de sorte qu'un paquet contaminé peut afficher « NuGet content passed » et être publié - lignes 12-35 et 40-47 - source: plan canonique phase 13 et limites de provenance dans <code>docs/reproducibility.md</code> - recommandation: Codex peut ajouter un paquet négatif contaminé, scanner sémantiquement assembly/PDB et textuellement ressources, consigner hashes et résultats bruts, puis faire publier uniquement l'artefact exact ayant passé cette gate."},
  {dim:"authenticity",sev:"medium",status:"finding",id:"A360-310",file:"samples/OmniEurope.Blazor.Catalog/Components/Layout/MainLayout.razor:5-",module:"Catalog",size:"",text:"Le badge <code>Catalogue 110/110</code> présente le catalogue comme exhaustif alors que <code>docs/component-families.md:21</code> précise qu'il n'illustre qu'un sous-ensemble et que <code>Home.razor</code> ne rend que 36 balises Omni distinctes - ligne 5 - source : lecture complète et comparaison documentation-réalité - recommandation : Codex peut remplacer le badge par une formulation exacte telle que <code>110 cibles Razor présentes</code> et afficher séparément la couverture réelle des scénarios du catalogue."},
  {dim:"authenticity",sev:"medium",status:"finding",id:"A360-311",file:"src/OmniEurope.Blazor/Components/OmniHtmlEditor.razor:54-61-",module:"Library",size:"",text:"Les commandes gras, italique, indice et exposant transforment la totalité de la chaîne HTML au lieu de la sélection de l'utilisateur; la toolbar présente ainsi un comportement d'éditeur riche qu'elle n'implémente pas - lignes 54-61 - recommandation: Codex peut manipuler explicitement la sélection via interop ou réduire les libellés à la transformation réellement fournie."},
  {dim:"authenticity",sev:"medium",status:"finding",id:"A360-312",file:"docs/component-contracts.md:3,7,39,63,83,115,143,211,391-",module:"Repository",size:"",text:"Le rapport reconnaît explicitement que son parseur regex ne comprend pas Razor, mais publie tout de même comme candidats des faux paramètres manifestes (<code>FailureCount</code>, <code>Committee</code>, <code>Verdict</code>, plusieurs <code>Count</code> et <code>Status</code>); la mise en garde empêche une fausse promesse totale, sans rendre la matrice exploitable comme preuve de contrat - lignes 3, 7, 39, 63, 83, 115, 143, 211, 391 - source: cohérence interne et <code>docs/component-contracts.json</code> - recommandation: Codex peut régénérer ce document depuis un extracteur Razor/sémantique avec provenance par occurrence et tests négatifs, puis supprimer l'étiquette de non-fiabilité seulement après comparaison automatisée aux contrats réels."},
  {dim:"authenticity",sev:"medium",status:"finding",id:"A360-313",file:"docs/component-coverage.md:3",module:"Repository",size:"",text:"Les avertissements des lignes 3 et 121 reconnaissent que <code>implémenté</code> signifie seulement « fichier présent », mais la table et le compteur principal continuent d'afficher 110 cibles « implémentées », y compris dialogue, graphiques empilés et éditeur dont les gates comportementales restent ouvertes; cette terminologie entretient une preuve de complétude plus forte que la mesure réelle - lignes 3-6, 29, 44, 84, 91, 101, 121 - source: <code>.claude/plan.md</code> et <code>docs/component-coverage.json</code> - recommandation: Codex peut renommer immédiatement le statut en <code>fichier présent</code>, puis le remplacer par des statuts de capacités calculés depuis des liens vérifiables vers tests, catalogue et preuves navigateur."},
  {dim:"authenticity",sev:"medium",status:"finding",id:"A360-314",file:"plans/PLAN-001-composants-blazor.md:9-12",module:"Repository",size:"",text:"Ce plan ancien marque comme terminés le scan de « tous les projets » et la conservation d'un script reproductible, alors que le plan canonique actuel laisse précisément ouverts la correction des parseurs et le manifeste de provenance; il indique aussi la publication GitFlow en attente alors que le plan 002 la marque accomplie - lignes 9-12 et 21-26 - source: <code>plans/PLAN-002-remplacement-radzen.md</code> phases 1, 2 et 13 - recommandation: Codex peut clôturer ce plan historique avec un statut supersédé, relier chaque affirmation au plan canonique et ne conserver comme achevées que les preuves encore valides."},
  {dim:"dependencies",sev:"medium",status:"finding",id:"A360-315",file:".claude/audit/2026-08-11/artefacts/AUDIT_DEPENDENCIES.md:224",size:"",text:"La pile HybridSmoke est en retard (<code>Microsoft.Maui.Controls</code> et <code>Microsoft.AspNetCore.Components.WebView.Maui</code> 10.0.20 contre 10.0.90) et résout plusieurs composants .NET en 10.0.0 à côté du socle 10.0.10 - <code>Directory.Packages.props:8,13</code>, <code>samples/OmniEurope.Blazor.HybridSmoke/packages.lock.json</code> - source: <code>dotnet list ... --outdated --include-transitive</code> et comparaison exhaustive des verrous - <strong>remédiation Codex-exécutable:</strong> Codex mettra à jour les deux packages MAUI de manière coordonnée vers une version compatible avec le SDK/workload retenu, régénérera le verrou, puis exécutera restore verrouillé, build Hybrid Windows et smoke tests avant de conserver le changement."},
  {dim:"dependencies",sev:"medium",status:"finding",id:"A360-316",file:".claude/audit/2026-08-11/artefacts/AUDIT_DEPENDENCIES.md:225",size:"",text:"Le graphe de tests ne fournit pas le collecteur demandé par <code>--collect:\"XPlat Code Coverage\"</code>; le préflight échoue malgré <code>Microsoft.CodeCoverage@18.8.1</code> transitive, rendant couverture et CRAP non fiables - <code>tests/OmniEurope.Blazor.Tests/OmniEurope.Blazor.Tests.csproj:8-11</code>, <code>metrics/PREFLIGHT.md</code> - <strong>remédiation Codex-exécutable:</strong> Codex choisira une seule chaîne de couverture compatible, ajoutera et épinglera centralement le collecteur requis, ou alignera la commande sur Microsoft Code Coverage, puis prouvera la génération d'un fichier de couverture exploitable sur 57 tests ou plus."},
  {dim:"dependencies",sev:"medium",status:"finding",id:"A360-317",file:".claude/audit/2026-08-11/artefacts/AUDIT_DEPENDENCIES.md:226",size:"",text:"Les actions CI et publication sont référencées par tags majeurs mutables, y compris <code>NuGet/login@v1</code> dans le job disposant de <code>id-token: write</code> - <code>.github/workflows/ci.yml:16-17,61,69-70</code>, <code>.github/workflows/publish-nuget.yml:16-17,26</code> - <strong>remédiation Codex-exécutable:</strong> Codex résoudra les révisions officielles approuvées, remplacera chaque tag par un SHA complet avec commentaire de version, puis configurera une mise à jour automatisée contrôlée et validera les workflows."},
  {dim:"dependencies",sev:"medium",status:"finding",id:"A360-318",file:"Directory.Packages.props:8",module:"Repository",size:"",text:"Les deux packages MAUI sont épinglés en <code>10.0.20</code> alors que le scan NuGet les trouve en retard sur le servicing <code>10.0.90</code>; le verrou Hybrid résout en conséquence plusieurs composants .NET en <code>10.0.0</code> à côté du socle <code>10.0.10</code> - lignes 8 et 13 - source: <code>AUDIT_DEPENDENCIES.md</code> D-001 - recommandation: Codex peut mettre à niveau les deux packages de manière coordonnée avec le SDK/workload retenu, régénérer le verrou puis prouver restore verrouillé et build Hybrid Windows."},
  {dim:"dependencies",sev:"low",status:"finding",id:"A360-319",file:".claude/audit/2026-08-11/artefacts/AUDIT_DEPENDENCIES.md:230",size:"",text:"<code>bunit@2.8.6</code> est derrière <code>2.9.0</code>; son graphe conserve notamment AngleSharp CSS beta et Microsoft Testing Platform 1.9.1 - <code>Directory.Packages.props:6</code>, <code>tests/OmniEurope.Blazor.Tests/packages.lock.json</code> - source: analyse outdated NuGet.org - <strong>remédiation Codex-exécutable:</strong> Codex mettra à niveau bUnit dans une branche isolée, régénérera le verrou en mode contrôlé et exécutera les 57 tests, les tests CSP et les budgets avant d'accepter la résolution transitive."},
  {dim:"dependencies",sev:"low",status:"finding",id:"A360-320",file:".claude/audit/2026-08-11/artefacts/AUDIT_DEPENDENCIES.md:231",size:"",text:"Aucun SBOM ou inventaire versionné des licences tierces ne couvre les 81 packages uniques; quatre packages Hybrid utilisent une licence par fichier ou URL au lieu d'une expression SPDX et WindowsAppSDK porte des termes propriétaires - <code>NOTICE.md</code>, <code>samples/OmniEurope.Blazor.HybridSmoke/packages.lock.json</code> - <strong>remédiation Codex-exécutable:</strong> Codex générera un SBOM et un registre de notices à partir des verrous, conservera les textes requis avec les artefacts redistribués et ajoutera un contrôle CI qui échoue sur toute licence absente ou sur tout changement inattendu de classification."},

function getFiltered(){

function renderItem(item){

let stlScrollTimer=null;
function buildTimeline(){
  const track=document.getElementById('stlTrack'),tl=document.getElementById('scrollTimeline'),thumb=document.getElementById('stlThumb');
  const secs=[...document.querySelectorAll('#content .section')];
  [...track.querySelectorAll('.stl-seg')].forEach(s=>s.remove());
  if(secs.length<1){tl.style.display='none';return;}
  tl.style.display='';
  const first=secs[0].offsetTop,last=secs[secs.length-1];
  const totalH=Math.max(1,(last.offsetTop+last.offsetHeight)-first);
  secs.forEach(s=>{
    const seg=document.createElement('div');
    seg.className='stl-seg';seg.dataset.cat=s.id;
    seg.style.flex='0 0 '+((s.offsetHeight/totalH)*100)+'%';
    const h2=s.querySelector('h2');seg.title=h2?h2.textContent:s.id;
    seg.onclick=()=>document.getElementById(s.id).scrollIntoView({behavior:'smooth'});
    track.insertBefore(seg,thumb);
  });
  updateTimeline();
}
function updateTimeline(){
  const secs=[...document.querySelectorAll('#content .section')];
  if(!secs.length)return;
  const scrollTop=window.scrollY||document.documentElement.scrollTop;
  const first=secs[0].offsetTop,last=secs[secs.length-1];
  const totalH=Math.max(1,(last.offsetTop+last.offsetHeight)-first);
  const prog=Math.min(1,Math.max(0,((scrollTop+window.innerHeight/2)-first)/totalH));
  document.getElementById('stlThumb').style.top=(prog*100)+'%';
  const readout=document.getElementById('stlReadout');readout.style.top=(prog*100)+'%';
  const allItems=[...document.querySelectorAll('#content .item')];
  if(!allItems.length){readout.innerHTML='';document.querySelectorAll('.stl-seg').forEach(s=>s.classList.remove('active'));return;}
  const vc=window.innerHeight/2;let gIdx=0,best=Infinity;
  allItems.forEach((it,i)=>{const r=it.getBoundingClientRect();const d=Math.abs((r.top+r.height/2)-vc);if(d<best){best=d;gIdx=i;}});
  const cur=allItems[gIdx],sec=cur.closest('.section'),cat=sec.id;
  const catItems=[...sec.querySelectorAll('.item')],cIdx=catItems.indexOf(cur);
  const h2=sec.querySelector('h2'),name=h2?h2.textContent:cat;
  document.querySelectorAll('.stl-seg').forEach(s=>s.classList.toggle('active',s.dataset.cat===cat));
  readout.innerHTML=`<strong>${name}</strong><span class="stl-pos">${cIdx+1} / ${catItems.length}</span> · <span class="stl-total">${gIdx+1} / ${allItems.length}</span>`;
}
function onTimelineScroll(){

}

const auditDimOrder = ["correctness","security","architecture","quality","performance","tests","conventions","leftovers","completeness","docs","authenticity","dependencies","metrics"];
