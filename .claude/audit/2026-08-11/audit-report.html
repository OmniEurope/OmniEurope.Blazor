<script>
const items = [
  {dim:"correctness",sev:"high",status:"finding",id:"A360-001",file:"src/OmniEurope.Blazor/Components/OmniScheduler.razor:71-79",module:"Library",size:"",text:"<code>Range()</code> convertit <code>local.Date</code> en <code>DateTimeOffset</code> par conversion implicite selon le fuseau de la machine, pas selon le paramètre <code>TimeZone</code>; les requêtes distantes couvrent donc de mauvaises bornes hors fuseau local et autour des transitions DST - lignes 71-79 et 90-96 - recommandation: Codex peut construire chaque borne avec l'offset du fuseau ciblé puis couvrir les fuseaux non locaux et les transitions."},
  {dim:"correctness",sev:"medium",status:"finding",id:"A360-002",file:"src/OmniEurope.Blazor/Components/OmniCompareValidator.razor:14",module:"Library",size:"",text:"L'accesseur de <code>Other</code> est compilé seulement à l'initialisation; un changement ultérieur de l'expression paramètre continue donc à comparer l'ancienne valeur - lignes 14 et 19-22 - recommandation: Codex peut recompiler lorsque l'identité de l'expression change."},
  {dim:"correctness",sev:"medium",status:"finding",id:"A360-003",file:"src/OmniEurope.Blazor/Components/OmniDataGrid.razor:245-288-",module:"Library",size:"",text:"En mode local, le pipeline applique la pagination avant certains calculs et interactions de tri/filtrage, ce qui peut produire une page et un total incohérents avec la vue demandée - lignes 245-288 - recommandation: Codex peut formaliser puis appliquer un pipeline unique filtre, tri et pagination."},
  {dim:"correctness",sev:"medium",status:"finding",id:"A360-004",file:"src/OmniEurope.Blazor/Components/OmniMonthView.razor:3-13-",module:"Library",size:"",text:"La vue mensuelle rend uniquement les jours 1 à N sans cellules de décalage pour le jour de semaine du premier du mois; les colonnes ne correspondent donc pas au calendrier attendu - lignes 3-13 - recommandation: Codex peut générer une matrice de semaines alignée sur le premier jour configuré par la culture."},
  {dim:"correctness",sev:"medium",status:"finding",id:"A360-005",file:"src/OmniEurope.Blazor/Components/OmniPanelMenuItem.razor:45-58-",module:"Library",size:"",text:"La détection de l'élément actif compare des chaînes d'URI brutes et ne normalise pas correctement chemin, query string et fragment, ce qui produit des états actifs erronés - lignes 45-58 - recommandation: Codex peut comparer des URI normalisées selon la règle de correspondance configurée."},
  {dim:"correctness",sev:"medium",status:"finding",id:"A360-006",file:"src/OmniEurope.Blazor/Components/OmniScheduler.razor:50",module:"Library",size:"",text:"Le paramètre <code>Date</code> et l'action Aujourd'hui reposent sur <code>DateTimeOffset.Now</code>, ce qui rend le composant non déterministe et difficile à tester aux changements de jour ou de fuseau - lignes 50 et 124 - recommandation: Codex peut injecter une abstraction d'horloge interne ou accepter explicitement la date courante."},
  {dim:"correctness",sev:"medium",status:"finding",id:"A360-007",file:"src/OmniEurope.Blazor/Components/OmniValidatorBase.cs:14-41",module:"Library",size:"",text:"<code>For</code>, <code>CurrentEditContext</code>, l'accesseur compilé et les abonnements sont figés à l'initialisation; un remplacement de modèle, d'expression ou de contexte laisse le validateur attaché à l'ancien champ - lignes 14-41 et 91-99 - recommandation: Codex peut détecter ces changements, se désabonner puis reconstruire le champ et le magasin de messages."},
  {dim:"security",sev:"high",status:"finding",id:"A360-008",file:"samples/OmniEurope.Blazor.Catalog/Program.cs:23-27",module:"Catalog",size:"",text:"<code>/csp-report</code> lit intégralement chaque corps sans vérifier le type, sans limite applicative adaptée à un petit rapport, sans propager <code>RequestAborted</code>, puis conserve chaque chaîne sans borne dans un singleton ; des requêtes répétées peuvent donc épuiser mémoire et CPU - lignes 23-27 et 36-39 - source : <code>metrics/SECURITY_SCAN.md</code>, revue manuelle best-effort non outillée et backlog déjà tracé dans <code>.claude/auditsession.md:30</code> - recommandation : Codex peut accepter uniquement les types CSP attendus, limiter strictement le corps et le nombre/la taille des entrées retenues, annuler la lecture avec la requête et ajouter des tests négatifs de dépassement et de concurrence."},
  {dim:"security",sev:"high",status:"finding",id:"A360-009",file:"src/OmniEurope.Blazor/Components/OmniBreadcrumbItem.razor:10",module:"Library",size:"",text:"<code>Href</code> est rendu sans validation de schéma; une valeur non fiable telle que <code>javascript:</code> reste exécutable au clic malgré l'encodage HTML - lignes 10 et 16 - revue best-effort, non outillée - recommandation: Codex peut centraliser une validation des URI autorisant seulement les schémas et chemins explicitement supportés."},
  {dim:"security",sev:"high",status:"finding",id:"A360-010",file:"src/OmniEurope.Blazor/Components/OmniLink.razor:5",module:"Library",size:"",text:"<code>Href</code> est rendu sans validation de schéma; une valeur non fiable <code>javascript:</code> reste exécutable au clic - lignes 5 et 15 - revue best-effort, non outillée - recommandation: Codex peut refuser les schémas dangereux et centraliser une politique URI partagée."},
  {dim:"security",sev:"high",status:"finding",id:"A360-011",file:"src/OmniEurope.Blazor/Components/OmniPanelMenuItem.razor:17,32",module:"Library",size:"",text:"<code>Href</code> est rendu et transmis à <code>NavigateTo</code> sans validation de schéma; une valeur non fiable peut utiliser un schéma actif - lignes 17, 32 et 60-65 - revue best-effort, non outillée - recommandation: Codex peut appliquer la politique URI sûre commune."},
  {dim:"security",sev:"high",status:"finding",id:"A360-012",file:"src/OmniEurope.Blazor/Components/OmniProfileMenuItem.razor:5",module:"Library",size:"",text:"Le lien <code>Href</code> est rendu sans politique de schémas autorisés - lignes 5 et 14 - revue best-effort, non outillée - recommandation: Codex peut réutiliser la validation URI commune avant rendu."},
  {dim:"security",sev:"high",status:"finding",id:"A360-013",file:"src/OmniEurope.Blazor/Components/OmniUpload.razor:147-150-",module:"Library",size:"",text:"L'erreur d'upload affiche directement <code>exception.Message</code>, ce qui peut divulguer des détails d'implémentation, chemins ou réponses de service à l'utilisateur - lignes 147-150 - revue best-effort, non outillée - recommandation: Codex peut journaliser le détail côté hôte et afficher un message public stable et localisable."},
  {dim:"security",sev:"high",status:"finding",id:"A360-014",file:"src/OmniEurope.Blazor/Internal/CspAttributeGuard.cs:20-24-",module:"Library",size:"",text:"La garde ne bloque un attribut <code>on*</code> que lorsque sa valeur est exactement une <code>string</code>; une valeur splattée d'un autre type peut encore être sérialisée comme gestionnaire inline et contourner le contrat CSP - lignes 20-24 - revue best-effort, non outillée - recommandation: Codex peut refuser tout attribut <code>on*</code> non reconnu comme callback Blazor sûr, avec tests de valeurs <code>MarkupString</code> et objets."},
  {dim:"security",sev:"high",status:"finding",id:"A360-015",file:"src/OmniEurope.Blazor/Internal/OmniHtmlSanitizer.cs:21-23",module:"Library",size:"",text:"La frontière qui alimente ensuite <code>MarkupString</code> assainit du HTML par expressions régulières plutôt que par un parseur conforme au tokenizer du navigateur; les balises malformées et mutations DOM ne bénéficient donc d'aucune garantie structurelle contre le XSS - lignes 21-23 et 67-77, usage dans <code>OmniHtmlEditor.razor:31</code> - SAST non fiable, revue best-effort non outillée - recommandation: Codex peut employer un parseur HTML maintenu avec allowlist de noeuds/attributs/URI et ajouter un corpus adversarial mXSS."},
  {dim:"security",sev:"medium",status:"finding",id:"A360-016",file:"samples/OmniEurope.Blazor.AutoSmoke/Program.cs:8-11-",module:"AutoSmoke",size:"",text:"Le trousseau ASP.NET Core Data Protection est persisté dans le chemin temporaire prévisible <code>OmniEurope.Blazor.AutoSmoke.Keys</code> sans mécanisme explicite de chiffrement au repos. La documentation ASP.NET Core 10 confirme qu'un emplacement explicite désactive le chiffrement automatique des clés; une lecture ou altération locale de ce répertoire peut donc compromettre les charges protégées et le partage du même <code>ApplicationName</code> étend l'impact aux instances du smoke host - lignes 8-11 - revue best-effort, non outillée; source: <code>metrics/SECURITY_SCAN.md</code> et <a href=\"https://learn.microsoft.com/en-us/aspnet/core/security/data-protection/implementation/key-storage-providers?view=aspnetcore-10.0\" target=\"_blank\" rel=\"noopener\">Microsoft Learn</a> - recommandation: Codex peut supprimer la persistance temporaire explicite et conserver le fournisseur par défaut pour ce smoke host jetable, ou configurer un emplacement non temporaire avec protection de clés adaptée à chaque système d'exploitation si une persistance inter-redémarrage est réellement requise."},
  {dim:"security",sev:"medium",status:"finding",id:"A360-017",file:"samples/OmniEurope.Blazor.Catalog/Program.cs:13-22-",module:"Catalog",size:"",text:"Le pipeline ajoute uniquement CSP et omet les protections Web attendues par le kit, notamment <code>X-Content-Type-Options</code>, <code>Referrer-Policy</code>, <code>Permissions-Policy</code> et HSTS hors développement - lignes 13-22 - source : <code>C:\\Dev\\_Generic\\docs\\coding-standards.md</code> - recommandation : Codex peut centraliser ces en-têtes, activer HSTS uniquement sur un déploiement HTTPS non local, puis ajouter une vérification HTTP de leurs valeurs."},
  {dim:"security",sev:"medium",status:"finding",id:"A360-018",file:"samples/OmniEurope.Blazor.Catalog/Program.cs:29-31-",module:"Catalog",size:"",text:"<code>/csp-status</code> est public et renvoie les rapports bruts fournis à l'endpoint précédent ; ces données non fiables peuvent contenir URL de document, référent, source et chaînes arbitraires, ce qui expose des détails internes au lieu d'un simple état de sonde - lignes 29-31 - source : revue manuelle best-effort non outillée - recommandation : Codex peut limiter la réponse publique à des compteurs bornés, réserver le détail à l'environnement de test avec contrôle d'accès et neutraliser les champs avant journalisation."},
  {dim:"security",sev:"medium",status:"finding",id:"A360-019",file:"src/OmniEurope.Blazor/Components/OmniUpload.razor:56-62",module:"Library",size:"",text:"Les limites de taille, nombre et type MIME sont vérifiées seulement à partir des métadonnées fournies par le client; elles ne constituent pas une frontière de sécurité pour le contenu reçu - lignes 56-62 et 82-110 - recommandation: Codex peut documenter ce contrat et fournir des hooks de validation serveur par flux et signature de contenu."},
  {dim:"security",sev:"medium",status:"finding",id:"A360-020",file:".github/workflows/ci.yml:16-17,61,69-70-",module:"Repository",size:"",text:"Les trois actions tierces sont référencées par tags majeurs mutables (<code>actions/checkout@v4</code>, <code>actions/setup-dotnet@v5</code>, <code>actions/upload-artifact@v4</code>), ce qui permet au code exécuté par la CI de changer sans modification du dépôt - lignes 16-17, 61, 69-70 - source: revue supply-chain <code>AUDIT_DEPENDENCIES.md</code> - recommandation: Codex peut résoudre des SHA complets officiels, conserver la version en commentaire et configurer leur renouvellement automatisé contrôlé."},
  {dim:"security",sev:"medium",status:"finding",id:"A360-021",file:".github/workflows/publish-nuget.yml:7-9,16-17,24-28-",module:"Repository",size:"",text:"<code>checkout</code>, <code>setup-dotnet</code> et surtout <code>NuGet/login</code> dans un job doté de <code>id-token: write</code> sont référencés par tags majeurs mutables; le fournisseur de publication peut changer le code exécuté avec le jeton OIDC sans diff du dépôt - lignes 7-9, 16-17, 24-28 - source: revue supply-chain <code>AUDIT_DEPENDENCIES.md</code> D-003 - recommandation: Codex peut épingler chaque action sur un SHA officiel complet, conserver les numéros de version en commentaire et automatiser des mises à jour revues."},
  {dim:"security",sev:"medium",status:"finding",id:"A360-022",file:"eng/Test-Csp.ps1:15-25-",module:"Repository",size:"",text:"Le scanner statique ne cherche que <code>style=</code>, les éléments style créés à l'exécution, <code>eval</code> et <code>new Function</code>; il laisse hors gate les gestionnaires HTML <code>on*=</code>, URL <code>javascript:</code>, imports/ressources distants et constructions indirectes, alors qu'aucune exécution navigateur ne compense ces angles morts - lignes 15-25 - source: comparaison avec <code>docs/csp-contract.md</code> et absence de preuve navigateur dans <code>docs/reproducibility.md</code> - recommandation: Codex peut étendre les règles source avec fixtures positives/négatives, puis les compléter par une gate navigateur réelle sous la CSP de référence sans présenter le scan statique comme preuve suffisante."},
  {dim:"security",sev:"medium",status:"finding",id:"A360-023",file:"SECURITY.md:3-5-",module:"Repository",size:"",text:"Le seul canal de divulgation proposé est la fonctionnalité GitHub privée « lorsque celle-ci est activée », sans confirmer son activation ni fournir de repli; si elle est absente, un chercheur ne dispose d'aucun moyen confidentiel documenté alors que les issues publiques sont interdites - lignes 3-5 - source: revue documentaire best-effort, non outillée - recommandation: Codex peut configurer et vérifier les advisories privés du dépôt, ajouter un contact de sécurité contrôlé et documenter délais d'accusé/réponse, versions supportées et procédure de divulgation."},
  {dim:"security",sev:"medium",status:"finding",id:"A360-024",file:"samples/OmniEurope.Blazor.WasmSmoke/wwwroot/index.html:6-",module:"WasmSmoke",size:"",text:"<code>frame-ancestors 'none'</code> est livré dans une balise <code>meta</code>, où cette directive doit être ignorée ; la page paraît donc protégée contre l'encapsulation alors que cette protection n'est pas appliquée par la politique locale - ligne 6 - source : <a href=\"https://w3c.github.io/webappsec-csp/#directive-frame-ancestors\" target=\"_blank\" rel=\"noopener\">W3C CSP Level 3, section <code>frame-ancestors</code></a> et <code>docs/csp-contract.md</code> - recommandation : Codex peut faire émettre <code>frame-ancestors 'none'</code> comme en-tête HTTP par les hôtes de déploiement, vérifier l'en-tête dans la sonde publiée et retirer la directive trompeuse de la balise <code>meta</code>."},
  {dim:"security",sev:"low",status:"finding",id:"A360-025",file:"samples/OmniEurope.Blazor.AutoSmoke/Program.cs:17-24-",module:"AutoSmoke",size:"",text:"Le middleware CSP apporte une base stricte, mais l'hôte Web n'ajoute pas <code>X-Content-Type-Options: nosniff</code>, <code>Referrer-Policy</code> ni <code>Permissions-Policy</code>, pourtant requis par les standards Web du kit; la défense en profondeur reste donc incomplète si le smoke host est exposé au-delà d'un poste local - lignes 17-24 - revue best-effort, non outillée; source: <code>C:\\Dev\\_Generic\\docs\\coding-standards.md</code> - recommandation: Codex peut compléter le même middleware avec ces trois en-têtes, puis vérifier leurs valeurs sur une réponse de l'hôte sans relâcher la CSP existante."},
  {dim:"security",sev:"low",status:"finding",id:"A360-026",file:"samples/OmniEurope.Blazor.Catalog/Program.cs:16-19-",module:"Catalog",size:"",text:"<code>connect-src 'self' ws: wss:</code> autorise des connexions WebSocket vers toute origine, au-delà du seul hub Blazor de l'hôte - lignes 16-19 - source : contrat CSP et backlog <code>.claude/auditsession.md:38</code>, revue best-effort non outillée - recommandation : Codex peut vérifier la prise en charge WebSocket de <code>'self'</code> sur les navigateurs cibles, puis borner les sources aux schémas/hôtes réellement nécessaires sans affaiblir le mode Interactive Server."},
  {dim:"security",sev:"low",status:"finding",id:"A360-027",file:"samples/OmniEurope.Blazor.WasmSmoke/wwwroot/index.html:6-",module:"WasmSmoke",size:"",text:"<code>connect-src 'self' ws: wss:</code> autorise des connexions WebSocket vers n'importe quelle origine, alors que ce client autonome n'observe aucun besoin de connexion WebSocket hors développement - ligne 6 - source : revue manuelle best-effort, non outillée, et politique indicative plus restrictive de <code>docs/csp-contract.md</code> - recommandation : Codex peut séparer la CSP de développement de celle publiée, borner <code>connect-src</code> aux origines effectivement requises et prouver le démarrage WebAssembly sous la politique resserrée."},
  {dim:"architecture",sev:"high",status:"finding",id:"A360-028",file:".claude/audit/2026-08-11/artefacts/AUDIT_ARCHITECTURE.md:146",size:"",text:"<code>OmniChart</code> rend directement <code>ChildContent</code>, tandis que <code>OmniValueAxis</code> calcule ses graduations indépendamment et que chaque série passe par <code>OmniChartGeometry.Clamp</code> sur une échelle fixe 0-100. Les variantes empilées repartent aussi de la même ligne de base au lieu de partager un cumul. Les axes, séries et empilements sont donc des fragments juxtaposés, pas un domaine de graphique composé - lignes 4-18 ; preuves croisées <code>OmniChartTypes.cs:8-13</code>, <code>OmniValueAxis.razor:3-16</code>, <code>OmniStackedColumnSeries.razor:2-7</code>, <code>OmniStackedAreaSeries.razor:1-7</code> et cible <code>docs/component-roadmap.md:17,44</code> - recommandation : Codex peut introduire un contexte interne de graphique qui enregistre axes et séries, calcule une projection immuable (domaines, échelles, catégories, baselines positives/négatives), puis fait rendre les composants à partir de cette projection sans modifier l'API déclarative observée ; Codex ajoutera des tests SVG sur domaines décalés, valeurs négatives, empilements et données vides avant de fermer l'écart."},
  {dim:"architecture",sev:"high",status:"finding",id:"A360-029",file:".claude/audit/2026-08-11/artefacts/AUDIT_KIT.md:135",size:"",text:"Projet non conforme au kit <code>_Generic</code> et type RCL non modélisé. Le type détecté ne correspond à aucun archétype du kit, et son objectif de remplacement de Radzen contredit le contrat UI canonique (<code>README.md:3</code>, <code>docs/architecture.md:15</code>, <code>C:\\Dev\\_Generic\\CLAUDE.md:5-8</code>, <code>C:\\Dev\\_Generic\\docs\\code-rules.md:76-85</code>). Cette ambiguïté rend les règles héritées inapplicables sans adaptation explicite. Recommandation: Codex devra formaliser un archétype RCL dans la gouvernance du projet, préciser les règles du kit conservées, adaptées ou non applicables, puis relier cette décision depuis <code>CLAUDE.md</code>."},
  {dim:"architecture",sev:"high",status:"finding",id:"A360-030",file:".claude/audit/2026-08-11/artefacts/AUDIT_KIT.md:141",size:"",text:"Infrastructure de localisation obligatoire absente. Aucun <code>IStringLocalizer&lt;AppStrings&gt;</code>, marqueur <code>AppStrings</code> ou fichier <code>.resx</code> n'est présent, alors que <code>STD-I18N</code> est de sévérité élevée et que le kit l'exige au niveau projet. Recommandation: Codex devra définir le contrat de localisation propre à une bibliothèque réutilisable, fournir des ressources par défaut et des points de surcharge par l'hôte, puis câbler les tests globaux correspondants."},
  {dim:"architecture",sev:"high",status:"finding",id:"A360-031",file:"src/OmniEurope.Blazor/Components/OmniChart.razor:4-18-",module:"Library",size:"",text:"Le composant juxtapose axes et séries via <code>ChildContent</code> sans domaine, échelles, catégories ni baseline partagés - lignes 4-18 - source: ARCH-01 dans AUDIT_ARCHITECTURE.md - recommandation: Codex peut introduire un contexte interne calculant une projection immuable tout en conservant l'API déclarative."},
  {dim:"architecture",sev:"high",status:"finding",id:"A360-032",file:"src/OmniEurope.Blazor/Components/OmniChartTypes.cs:10-13-",module:"Library",size:"",text:"<code>Clamp</code>, <code>Xy</code> et <code>Points</code> imposent un domaine global fixe 0-100, ce qui tronque silencieusement les valeurs négatives ou supérieures à 100 et empêche l'alignement avec <code>OmniValueAxis</code> - lignes 10-13 - source: ARCH-01 - recommandation: Codex peut projeter les données depuis les domaines calculés du graphique plutôt que les borner."},
  {dim:"architecture",sev:"high",status:"finding",id:"A360-033",file:"src/OmniEurope.Blazor/Components/OmniStackedAreaSeries.razor:1-8-",module:"Library",size:"",text:"La variante dite empilée reprend exactement la baseline zéro d'une aire simple et ne reçoit aucun cumul des séries précédentes - lignes 1-8 - source: ARCH-01 - recommandation: Codex peut rendre l'aire depuis les baselines positives et négatives du contexte de graphique."},
  {dim:"architecture",sev:"high",status:"finding",id:"A360-034",file:"src/OmniEurope.Blazor/Components/OmniStackedColumnSeries.razor:1-15-",module:"Library",size:"",text:"La variante dite empilée dessine chaque valeur depuis zéro et n'enregistre aucun cumul entre séries - lignes 1-15 - source: ARCH-01 - recommandation: Codex peut consommer les baselines empilées calculées par le contexte de graphique."},
  {dim:"architecture",sev:"high",status:"finding",id:"A360-035",file:"src/OmniEurope.Blazor/Components/OmniValueAxis.razor:3-16-",module:"Library",size:"",text:"L'axe affiche ses propres bornes mais ne les communique pas aux séries, lesquelles continuent à projeter sur 0-100; un axe différent décrit donc une géométrie contradictoire - lignes 3-16 - source: ARCH-01 - recommandation: Codex peut enregistrer l'axe dans le contexte de graphique et partager la même projection."},
  {dim:"architecture",sev:"medium",status:"finding",id:"A360-036",file:".claude/audit/2026-08-11/artefacts/AUDIT_ARCHITECTURE.md:154",size:"",text:"L'hôte rend directement un unique dialogue remplaçable et la liste de notifications, alors que tooltip et menu contextuel restent rendus et contrôlés localement. La famille possède donc deux modèles de cycle de vie et aucune pile centrale pour ordre, imbrication, verrouillage du scroll ou arbitrage d'Escape. Cela dévie de la cible de « couche de portail contrôlée » - lignes 4-23 ; preuves croisées <code>OmniOverlayTypes.cs:21-60</code>, <code>OmniTooltip.razor:3-18</code>, <code>OmniContextMenu.razor:3-43</code>, <code>docs/component-roadmap.md:16</code> et <code>plans/PLAN-002-remplacement-radzen.md:56-62</code> - recommandation : Codex peut conserver <code>OmniComponentsHost</code> et <code>OmniOverlayService</code> comme façade publique, ajouter un coordinateur interne de portail avec identifiants et pile ordonnée, puis faire converger dialogue, notification et les popups qui exigent un portail vers ce cycle de vie ; des tests navigateur de focus, imbrication, Escape et restauration fermeront la frontière."},
  {dim:"architecture",sev:"medium",status:"finding",id:"A360-037",file:".claude/audit/2026-08-11/artefacts/AUDIT_ARCHITECTURE.md:160",size:"",text:"Le composant de 451 lignes possède à la fois le registre des colonnes, les filtres et tris locaux, la pagination, le chargement distant et son annulation, la sélection, l'expansion, l'édition, le regroupement, le redimensionnement et le rendu. Cette concentration enfreint le principe de responsabilité unique et rend les changements de projection difficiles à tester sans rendu bUnit - lignes 145-451 ; preuve documentaire <code>plans/PLAN-002-remplacement-radzen.md:122-136</code> - recommandation : Codex peut préserver la façade et les paramètres publics, extraire un moteur interne pur <code>GridProjection&lt;TItem&gt;</code> pour filtre/tri/groupe/page et un état interne de chargement annulable, puis tester ces unités indépendamment avant d'alléger le code de rendu."},
  {dim:"architecture",sev:"medium",status:"finding",id:"A360-038",file:".claude/audit/2026-08-11/artefacts/AUDIT_ARCHITECTURE.md:166",size:"",text:"<code>OmniDataGridColumnDefinition&lt;TItem&gt;</code> et <code>OmniDataGridContext&lt;TItem&gt;</code> sont publics alors que les recherches vérifiées ne trouvent que les usages internes du couple DataGrid/Column. Le même défaut concerne <code>OmniTabsContext</code>, <code>OmniStepsContext</code> et <code>OmniTreeContext&lt;TValue&gt;</code>. Ces types de transport en cascade sont inscrits dans <code>docs/public-api.txt</code>, ce qui expose l'implémentation parent-enfant et augmente inutilement la surface de rupture - lignes 48-69 ; preuves croisées <code>OmniNavigationTypes.cs:5-15</code>, <code>OmniCollectionTypes.cs:3-7</code>, <code>docs/public-api.txt:503-506,535-539</code> - recommandation : Codex peut confirmer une dernière fois l'absence de consommateur dans l'inventaire de migration, rendre ces cinq types internes avant 1.0, régénérer la baseline publique et ajouter une garde sémantique qui empêche les types de coordination internes de redevenir publics."},
  {dim:"architecture",sev:"medium",status:"finding",id:"A360-039",file:".claude/audit/2026-08-11/artefacts/AUDIT_KIT.md:151",size:"",text:"Les composants ne suivent aucun découpage vertical ou par famille. Les 120 fichiers de <code>src/OmniEurope.Blazor/Components</code> sont tous à la racine du dossier, malgré les familles fonctionnelles déjà documentées. Cela concentre la navigation, les noms et les responsabilités dans un répertoire unique. Recommandation: Codex devra concevoir un découpage RCL par familles stables, préserver l'API publique et les espaces de noms nécessaires, puis aligner tests et documentation sur cette structure."},
  {dim:"architecture",sev:"medium",status:"finding",id:"A360-040",file:"src/OmniEurope.Blazor/Components/OmniAreaSeries.razor:4-8-",module:"Library",size:"",text:"La série projette directement toutes les valeurs sur l'échelle fixe 0-100 via <code>OmniChartGeometry</code>, sans domaine partagé avec les axes - lignes 4-8 - source: ARCH-01 dans AUDIT_ARCHITECTURE.md - recommandation: Codex peut faire consommer à la série une projection calculée par un contexte interne de graphique."},
  {dim:"architecture",sev:"medium",status:"finding",id:"A360-041",file:"src/OmniEurope.Blazor/Components/OmniBarSeries.razor:2-7-",module:"Library",size:"",text:"La largeur des barres dépend de valeurs bornées arbitrairement à 0-100 et non d'un domaine d'axe partagé - lignes 2-7 - source: ARCH-01 - recommandation: Codex peut utiliser la projection commune du graphique."},
  {dim:"architecture",sev:"medium",status:"finding",id:"A360-042",file:"src/OmniEurope.Blazor/Components/OmniCollectionTypes.cs:3-7-",module:"Library",size:"",text:"<code>OmniTreeContext&lt;TValue&gt;</code> est public alors qu'il ne sert qu'au transport en cascade interne entre <code>OmniTree</code> et ses éléments - lignes 3-7 - source: ARCH-04 - recommandation: Codex peut rendre ce contexte interne avant 1.0 après vérification de la surface de migration."},
  {dim:"architecture",sev:"medium",status:"finding",id:"A360-043",file:"src/OmniEurope.Blazor/Components/OmniColumnSeries.razor:5-8-",module:"Library",size:"",text:"La série borne les hauteurs à 0-100 sans domaine partagé avec l'axe et transforme toute valeur négative en zéro - lignes 5-8 - source: ARCH-01 - recommandation: Codex peut utiliser une projection de coordonnées commune."},
  {dim:"architecture",sev:"medium",status:"finding",id:"A360-044",file:"src/OmniEurope.Blazor/Components/OmniComponentsHost.razor:4-23-",module:"Library",size:"",text:"Le composant concentre dans une même frontière le contenu applicatif, le dialogue global et toutes les notifications, ce qui couple des cycles de vie indépendants - lignes 4-23 - source: ARCH-02 - recommandation: Codex peut séparer les hôtes internes de dialogue et de notifications tout en conservant un point d'enregistrement public unique."},
  {dim:"architecture",sev:"medium",status:"finding",id:"A360-045",file:"src/OmniEurope.Blazor/Components/OmniDataGrid.razor:1-455-",module:"Library",size:"",text:"Le composant cumule en un seul fichier chargement distant, requêtage local, sélection, édition, expansion, redimensionnement et rendu - lignes 1-455 - source: ARCH-03 - recommandation: Codex peut extraire des services internes de projection et d'état sans fragmenter l'API publique."},
  {dim:"architecture",sev:"medium",status:"finding",id:"A360-046",file:"src/OmniEurope.Blazor/Components/OmniDataGridTypes.cs:48-69-",module:"Library",size:"",text:"<code>OmniDataGridColumnDefinition&lt;TItem&gt;</code> et <code>OmniDataGridContext&lt;TItem&gt;</code> sont publics alors que leurs usages observés sont internes au couple grille/colonne - lignes 48-69 - source: ARCH-04 - recommandation: Codex peut les rendre internes avant 1.0 après vérification de compatibilité."},
  {dim:"architecture",sev:"medium",status:"finding",id:"A360-047",file:"src/OmniEurope.Blazor/Components/OmniLineSeries.razor:4-8-",module:"Library",size:"",text:"Les points sont bornés sur une échelle fixe 0-100 indépendante des axes - lignes 4-8 - source: ARCH-01 - recommandation: Codex peut consommer la projection commune du graphique."},
  {dim:"architecture",sev:"medium",status:"finding",id:"A360-048",file:"src/OmniEurope.Blazor/Components/OmniMarkers.razor:2-5-",module:"Library",size:"",text:"Les marqueurs bornent silencieusement X et Y à 0-100 sans domaine partagé avec les axes - lignes 2-5 - source: ARCH-01 - recommandation: Codex peut consommer la projection commune du graphique."},
  {dim:"architecture",sev:"medium",status:"finding",id:"A360-049",file:"src/OmniEurope.Blazor/Components/OmniNavigationTypes.cs:5-15-",module:"Library",size:"",text:"<code>OmniTabsContext</code> et <code>OmniStepsContext</code> sont publics alors que leurs usages sont limités à la composition en cascade interne - lignes 5-15 - source: ARCH-04 - recommandation: Codex peut les rendre internes avant 1.0."},
  {dim:"architecture",sev:"medium",status:"finding",id:"A360-050",file:"src/OmniEurope.Blazor/Components/OmniOverlayTypes.cs:20-55-",module:"Library",size:"",text:"<code>OmniOverlayService</code> ne conserve qu'un dialogue courant mais accumule les notifications sans borne ni politique d'expiration; le service mélange deux modèles de durée de vie incompatibles - lignes 20-55 - source: ARCH-02 - recommandation: Codex peut séparer les stores internes et définir capacité, remplacement et expiration."},
  {dim:"architecture",sev:"low",status:"finding",id:"A360-051",file:".claude/audit/2026-08-11/artefacts/AUDIT_ARCHITECTURE.md:174",size:"",text:"Le document d'architecture ne définit que les dossiers physiques. <code>docs/component-roadmap.md:9-20</code> distingue 12 familles, <code>docs/component-families.md:5-12</code> en agrège 8 et <code>samples/OmniEurope.Blazor.Catalog/Components/Pages/Home.razor:13</code> en annonce 10. Les 105 composants Razor restent dans un dossier et un namespace uniques, avec des fichiers attrape-tout tels que <code>OmniFoundationTypes.cs:3-108</code> et <code>OmniSelectionTypes.cs:5-24</code>. Le paquet unique est pertinent, mais l'absence de carte canonique affaiblit ownership, placement et couverture par domaine - lignes 3-15 - recommandation : Codex peut faire de <code>docs/architecture.md</code> l'autorité de la taxonomie, aligner les documents et le catalogue, puis ranger les sources et tests par dossiers logiques en conservant le projet, le namespace public et le paquet uniques."},
  {dim:"architecture",sev:"low",status:"finding",id:"A360-052",file:"samples/OmniEurope.Blazor.HybridSmoke/HybridSmokeTypes.cs:6-12-",module:"HybridSmoke",size:"",text:"<code>HybridSmokeTypes</code> et <code>RequiredTypes</code> sont publics alors qu'aucun appelant n'existe dans le dépôt et que l'architecture réserve ce module à un adaptateur terminal sans surface réutilisée - lignes 6-12 - source : recherche <code>HybridSmokeTypes|RequiredTypes</code> limitée au dépôt, sans autre résultat, et <code>AUDIT_ARCHITECTURE.md</code> - recommandation : Codex peut conserver cette preuve de résolution de types tout en rendant le conteneur et son membre internes, afin de ne pas exposer une API de sample inutile."},
  {dim:"architecture",sev:"low",status:"finding",id:"A360-053",file:"docs/architecture.md:3-15-",module:"Repository",size:"",text:"Le document décrit seulement les dossiers physiques et ne constitue pas l'autorité de la taxonomie logique: la roadmap compte 12 familles, <code>component-families.md</code> en agrège 8 et le catalogue en annonce 10; il omet aussi la direction des dépendances et les frontières de composition - lignes 3-15 - source: <code>AUDIT_ARCHITECTURE.md</code> ARCH-05 - recommandation: Codex peut publier ici une carte canonique des familles et dépendances, aligner les documents et le catalogue, puis ranger progressivement sources et tests par dossiers logiques sans scinder la RCL ni modifier l'API publique."},
  {dim:"architecture",sev:"low",status:"finding",id:"A360-054",file:"docs/component-families.md:5-12-",module:"Repository",size:"",text:"Cette carte agrège la surface en huit familles, tandis que <code>component-roadmap.md</code> en définit douze et que le catalogue en annonce dix; sans autorité canonique, les responsabilités, le placement et la couverture par domaine changent selon le document consulté - lignes 5-12 - source: <code>AUDIT_ARCHITECTURE.md</code> ARCH-05 - recommandation: Codex peut aligner cette synthèse sur la taxonomie canonique ajoutée à <code>docs/architecture.md</code>, puis faire dériver automatiquement les regroupements du catalogue et de la couverture de cette même source."},
  {dim:"quality",sev:"medium",status:"finding",id:"A360-055",file:"src/OmniEurope.Blazor/Components/OmniContextMenu.razor:4-16",module:"Library",size:"",text:"Le conteneur <code>role=\"menu\"</code> ne gère ni focus initial, ni déplacement par flèches, ni fermeture par Échap; il ne fournit donc pas le modèle clavier attendu d'un menu contextuel - lignes 4-16 et 24-52 - recommandation: Codex peut implémenter le focus roving et la fermeture clavier avec restauration du focus déclencheur."},

  {dim:"quality",sev:"low",status:"finding",id:"A360-058",file:"samples/OmniEurope.Blazor.AutoSmoke/wwwroot/app.css:1-3",module:"AutoSmoke",size:"",text:"La seule règle du fichier, <code>color-scheme: light dark</code>, n'est jamais chargée: aucune référence à <code>app.css</code> n'existe dans le module, et <code>App.razor</code> ne lie que la feuille de style de la bibliothèque. L'asset publié est donc mort et son intention de thème n'a aucun effet observable - lignes 1-3; source: recherche <code>rg</code> vérifiée dans le module - recommandation: Codex peut ajouter le lien vers <code>app.css</code> dans le <code>&lt;head&gt;</code> de <code>App.razor</code>, après la feuille de style de la bibliothèque, puis vérifier que le document charge bien l'asset; si ce comportement n'est plus souhaité, Codex pourra supprimer le fichier au lieu de conserver un asset inerte."},

  {dim:"tests",sev:"high",status:"finding",id:"A360-064",file:"samples/OmniEurope.Blazor.Catalog/Components/Pages/Home.razor:64-70-",module:"Catalog",size:"",text:"Plusieurs contrôles de formulaire n'ont aucun nom accessible associé : zone de texte, liste, autocomplete, date, slider, couleur et upload sont rendus hors <code>OmniFormField</code> et sans <code>aria-label</code> ; l'identifiant seul ne crée pas de label - lignes 64-70 - source : markup de la page et rendu des composants cibles, revue accessibilité manuelle best-effort - recommandation : Codex peut associer chaque contrôle à un label localisé via <code>OmniFormField</code> ou <code>aria-labelledby</code>, puis vérifier les noms accessibles dans un navigateur et un test bUnit."},

  {dim:"tests",sev:"high",status:"finding",id:"A360-066",file:"src/OmniEurope.Blazor/Components/OmniDataGrid.razor:233-239",module:"Library",size:"",text:"Un chargement distant valide retournant zéro élément laisse <code>_remoteItems.Count == 0</code>; <code>OnParametersSetAsync</code> relance alors automatiquement la requête à chaque rendu - lignes 233-239 et 366-371 - recommandation: Codex peut mémoriser explicitement qu'une plage a été chargée, indépendamment du nombre d'éléments."},
  {dim:"tests",sev:"high",status:"finding",id:"A360-067",file:"src/OmniEurope.Blazor/Components/OmniDataList.razor:75-91",module:"Library",size:"",text:"Un chargement réussi retournant une liste vide remplit de nouveau la condition <code>_items.Count == 0</code> et peut relancer la source à chaque cycle de paramètres; un changement de délégué <code>Load</code> avec une liste non vide n'est au contraire jamais rechargé - lignes 75-91 et 112-137 - recommandation: Codex peut suivre la clé ou génération de chargement et distinguer résultat vide de jamais chargé."},

  {dim:"tests",sev:"high",status:"finding",id:"A360-069",file:"eng/Test-PublicApi.ps1:10-29-",module:"Repository",size:"",text:"L'extraction par regex ne couvre qu'une forme de <code>[Parameter]</code> et les déclarations <code>enum|class|record</code> commençant exactement par <code>public</code>; elle ignore paramètres requis, méthodes, propriétés, constructeurs, interfaces, structs, delegates, opérateurs, membres hérités et contraintes, ce qui laisse passer des ruptures publiques importantes - lignes 10-29 - source: limites de <code>docs/public-api-conventions.md</code> et baseline voisine - recommandation: Codex peut remplacer l'extraction par Roslyn, sérialiser toutes les signatures publiques pertinentes de façon canonique et ajouter une fixture de rupture par catégorie pour prouver que la gate échoue."},
  {dim:"tests",sev:"high",status:"finding",id:"A360-070",file:"tests/OmniEurope.Blazor.Tests/ChartComponentTests.cs:7-28-",module:"Tests",size:"",text:"La suite graphique n'asserte aucune coordonnée SVG, projection de domaine, valeur négative ni cumul empilé; elle se limite aux rôles, textes et nombres de marqueurs/chemins, de sorte que l'échelle fixe 0-100 et les empilements sans cumul décrits par ARCH-01 peuvent rester verts - lignes 7-28 - source : <code>AUDIT_ARCHITECTURE.md</code> ARCH-01 et recherche transversale vérifiée dans <code>ChartComponentTests.cs</code>/<code>ChartTestHost.razor</code>; couverture outillée indisponible - recommandation : Codex ajoutera des assertions géométriques sur domaines décalés, valeurs négatives, séries empilées positives/négatives et données vides, à partir d'une projection attendue indépendante du rendu."},
  {dim:"tests",sev:"high",status:"finding",id:"A360-071",file:"samples/OmniEurope.Blazor.WasmSmoke/wwwroot/index.html:6-",module:"WasmSmoke",size:"",text:"La CSP limite <code>script-src</code> à <code>'self'</code> sans <code>'wasm-unsafe-eval'</code>, alors que la documentation Microsoft .NET 10 exige cette source pour permettre au runtime Mono côté client de fonctionner ; le smoke host risque donc d'échouer avant le rendu interactif - ligne 6 - source : <a href=\"https://learn.microsoft.com/en-us/aspnet/core/blazor/security/content-security-policy?view=aspnetcore-10.0\" target=\"_blank\" rel=\"noopener\">Microsoft Learn, CSP Blazor .NET 10</a> et <code>docs/compatibility.md</code> qui confirme l'absence de validation navigateur - recommandation : Codex peut ajouter uniquement <code>'wasm-unsafe-eval'</code> à <code>script-src</code>, publier l'hôte puis prouver dans un navigateur que le runtime démarre, que le compteur fonctionne et qu'aucune violation CSP inattendue n'est émise."},
  {dim:"tests",sev:"medium",status:"finding",id:"A360-072",file:".claude/audit/2026-08-11/artefacts/AUDIT_KIT.md:147",size:"",text:"Les trois gardes de conventions du kit sont absentes. Aucun <code>NavActiveStateGuardTests</code>, <code>ButtonConventionGuardTests</code> ou <code>DialogConventionGuardTests</code> n'existe. La CI est prête à les exécuter, mais aucune protection ne relie actuellement les règles de navigation, boutons et dialogues à un test de source. Recommandation: après stabilisation de l'overlay, Codex devra ajouter des gardes Omni adaptées, couvrir les hôtes réellement concernés et prouver leur exécution dans la suite existante."},
  {dim:"tests",sev:"medium",status:"finding",id:"A360-073",file:"samples/OmniEurope.Blazor.Catalog/Components/Layout/MainLayout.razor:6-",module:"Catalog",size:"",text:"Le layout rend directement <code>@Body</code> sans <code>ErrorBoundary</code>, contrairement au standard frontend du kit ; une exception de composant peut donc remplacer le catalogue par l'erreur globale du circuit - ligne 6 - source : <code>C:\\Dev\\_Generic\\docs\\coding-standards.md</code> - recommandation : Codex peut entourer le corps d'une frontière d'erreur localisée avec récupération observable, puis la vérifier dans le navigateur."},
  {dim:"tests",sev:"medium",status:"finding",id:"A360-074",file:"samples/OmniEurope.Blazor.HybridSmoke/OmniEurope.Blazor.HybridSmoke.csproj:13-14-",module:"HybridSmoke",size:"",text:"<code>D-001</code> : les références directes <code>Microsoft.Maui.Controls</code> et <code>Microsoft.AspNetCore.Components.WebView.Maui</code> héritent des versions centralisées 10.0.20, alors que le scan NuGet les donne en 10.0.90 et relève un sous-graphe <code>Microsoft.Extensions.*</code> partagé entre 10.0.0 et 10.0.10 - lignes 13-14 - source : <code>AUDIT_DEPENDENCIES.md</code> et <code>Directory.Packages.props</code> - recommandation : Codex peut mettre à niveau les deux packages MAUI de façon coordonnée avec le SDK et le workload retenus, régénérer le verrou, puis vérifier la restauration verrouillée et la compilation Hybrid Windows."},

  {dim:"tests",sev:"medium",status:"finding",id:"A360-084",file:"docs/component-inventory.json:2-4",module:"Repository",size:"",text:"L'inventaire est un instantané dépendant de <code>C:\\Dev</code> qui ne conserve ni révisions/empreintes des 32 projets, ni manifeste des fichiers scannés, ni paramètres/exclusions reproductibles; il agrège en plus projets actifs, modèles, archives et un miroir <code>_github/Aetheus</code>, de sorte qu'un tiers ne peut pas reproduire ni interpréter sans ambiguïté les 110 composants et leurs compteurs - lignes 2-4 et ensemble des entrées <code>projects</code>/<code>catalog</code> - source: <code>docs/reproducibility.md</code> et <code>docs/clean-room.md:27-29</code> - recommandation: Codex peut versionner un manifeste minimal par projet (statut, chemin logique, révision, empreinte et fichier source), séparer les agrégats actif/archive/modèle/miroir, ajouter un test de déduplication et régénérer l'inventaire depuis un corpus explicitement identifié."},

  {dim:"tests",sev:"medium",status:"finding",id:"A360-086",file:"docs/radzen-surface-inventory.json:2-6",module:"Repository",size:"",text:"L'inventaire de 1 457 fichiers dépend de l'état externe courant de <code>C:\\Dev</code> sans révision, hash ni manifeste d'entrée et inclut miroirs, archives, rapports d'audit et fichiers de couverture; ses compteurs ne sont ni reproductibles ni interprétables comme une vue stable du parc actif - lignes 2-6 et 507-1968 - source: <code>docs/reproducibility.md</code> - recommandation: Codex peut faire consommer au générateur un manifeste versionné des corpus, statuts, révisions et empreintes, séparer les vues actives des archives et sorties techniques, puis publier la commande et les hashes d'entrée."},

  {dim:"tests",sev:"medium",status:"finding",id:"A360-088",file:"eng/Generate-RadzenInventory.ps1:3,18-24,59-76",module:"Repository",size:"",text:"Le générateur balaie directement tout <code>C:\\Dev</code>, déduit le statut d'un projet de son préfixe de chemin et ne capture ni révision, empreinte, manifeste des entrées ni preuve de déduplication; deux exécutions sur des états externes différents produisent des priorités incompatibles sous le même format - lignes 3, 18-24, 59-76 et 152-159 - source: <code>docs/reproducibility.md</code> et inventaires générés - recommandation: Codex peut rendre obligatoire un manifeste de corpus versionné, valider les racines/statuts, enregistrer révisions et hashes, puis séparer explicitement actifs, modèles, archives et miroirs dans les sorties."},
  {dim:"tests",sev:"medium",status:"finding",id:"A360-089",file:"eng/Generate-RadzenSurfaceInventory.ps1:3,14-23",module:"Repository",size:"",text:"Le script inspecte l'état courant de <code>C:\\Dev</code> sans manifeste, révision ni hashes, inclut les rapports et archives qui contiennent le mot Radzen, et publie un compteur global sans statuts de projets; une régénération ne peut pas reproduire ni comparer proprement l'instantané - lignes 3, 14-23 et 89-104 - source: <code>docs/reproducibility.md</code> - recommandation: Codex peut alimenter le scan par un manifeste borné et empreinté, exclure explicitement sorties techniques et corpus non actifs, et persister paramètres, versions d'outils et entrées."},
  {dim:"tests",sev:"medium",status:"finding",id:"A360-090",file:"tests/OmniEurope.Blazor.Tests/ChartComponentTests.cs:21-27-",module:"Tests",size:"",text:"<code>ArcGauge_ClampsAndAnnouncesItsValue</code> annonce une vérification du bornage, mais ne fournit aucun cas hors limites et n'asserte qu'une valeur nominale <code>75</code> ainsi que le préfixe syntaxique <code>M </code> du chemin SVG; une régression supprimant le clamp pourrait donc rester verte - lignes 21-27 - source : lecture intégrale, couverture outillée indisponible - recommandation : Codex ajoutera des rendus avec valeurs sous le minimum et au-dessus du maximum, puis vérifiera la valeur annoncée et la géométrie normalisée attendue."},
  {dim:"tests",sev:"medium",status:"finding",id:"A360-091",file:"tests/OmniEurope.Blazor.Tests/DataGridComponentTests.cs:27-42-",module:"Tests",size:"",text:"<code>DataGrid_UsesCancelableRemoteRequestsAndTotalCount</code> ne provoque aucun chevauchement de requêtes et vérifie seulement que le jeton initial n'est pas déjà annulé; elle ne prouve donc pas que la requête précédente est annulée lors d'un rechargement - lignes 27-42 - source : lecture intégrale - recommandation : Codex pilotera deux chargements contrôlés, capturera leurs jetons, déclenchera le second avant la fin du premier et vérifiera l'annulation du premier ainsi que la conservation du résultat le plus récent."},
  {dim:"tests",sev:"medium",status:"finding",id:"A360-092",file:"tests/OmniEurope.Blazor.Tests/DataGridComponentTests.cs:8-24-",module:"Tests",size:"",text:"<code>DataGrid_SortsFiltersPagesAndSelectsByStableKey</code> affirme couvrir la pagination, mais n'effectue aucune action de page ni assertion sur l'index ou les lignes de la page suivante; elle agrège en outre tri, sélection et filtrage dans le même scénario - lignes 8-24 - source : lecture intégrale, couverture outillée indisponible - recommandation : Codex isolera un test de pagination qui change effectivement de page et vérifie le sous-ensemble attendu, puis séparera les autres comportements pour rendre chaque branche falsifiable."},
  {dim:"tests",sev:"medium",status:"finding",id:"A360-093",file:"tests/OmniEurope.Blazor.Tests/DataGridComponentTests.cs:8-71-",module:"Tests",size:"",text:"Aucun scénario DataGrid ne couvre regroupement, expansion, édition ou redimensionnement, alors que ces responsabilités publiques sont concentrées dans <code>OmniDataGrid</code>; une régression de ces branches ne serait détectée par aucune assertion observable du module - lignes 8-71 - source : <code>AUDIT_ARCHITECTURE.md</code> ARCH-03 et recherche transversale sans référence à ces comportements dans la suite/fixture; couverture outillée indisponible - recommandation : Codex ajoutera des scénarios isolés et falsifiables pour chaque branche, y compris les erreurs et transitions d'état."},
  {dim:"tests",sev:"medium",status:"finding",id:"A360-094",file:"tests/OmniEurope.Blazor.Tests/InteractionComponentTests.cs:126-139-",module:"Tests",size:"",text:"<code>DelayedValidator_CancelsStaleFieldValidation</code> dépend d'une attente murale fixe de 100 ms pour dépasser un délai de validation de 20 ms; sous charge ou ordonnanceur lent, le test peut observer un état intermédiaire et devenir intermittent - lignes 126-139 - source : lecture intégrale, critère de déterminisme - recommandation : Codex exposera ou injectera une horloge/temporisation contrôlable, ou attendra l'état fonctionnel avec une borne explicite plutôt qu'un <code>Task.Delay</code> arbitraire."},
  {dim:"tests",sev:"medium",status:"finding",id:"A360-095",file:"tests/OmniEurope.Blazor.Tests/OverlayComponentTests.cs:37-112-",module:"Tests",size:"",text:"Les scénarios de superposition ne couvrent que l'ouverture/fermeture nominale d'un dialogue et d'une notification; aucune assertion ne protège l'ordre ou l'imbrication, l'arbitrage d'Escape, le verrouillage du scroll ni la restauration du focus, alors que ces comportements constituent la frontière de portail attendue - lignes 37-112 - source : <code>AUDIT_ARCHITECTURE.md</code> ARCH-02, couverture outillée indisponible - recommandation : après convergence vers un coordinateur de portail, Codex ajoutera des tests navigateur falsifiables sur pile imbriquée, Escape, focus initial/restauré et scroll."},
  {dim:"tests",sev:"medium",status:"finding",id:"A360-096",file:"tests/OmniEurope.Blazor.Tests/PerformanceBudgetTests.cs:9-57-",module:"Tests",size:"",text:"Les trois budgets reposent sur un seul chronométrage sans warm-up ni isolation de la concurrence, et mesurent les allocations du seul thread courant; ils sont sensibles à la charge de la machine et peuvent ignorer des allocations effectuées ailleurs tout en donnant une impression de gate de performance fiable - lignes 9-57 - source : lecture intégrale, aucune métrique/complexité outillée disponible - recommandation : Codex séparera un benchmark reproductible avec warm-up et statistiques d'une garde CI calibrée sur un environnement contrôlé, et utilisera une mesure d'allocations adaptée à tout le processus ou au code réellement exercé."},
  {dim:"tests",sev:"medium",status:"finding",id:"A360-097",file:"tests/OmniEurope.Blazor.Tests/SchedulerComponentTests.cs:106-125-",module:"Tests",size:"",text:"<code>Scheduler_PreservesOverlapsAcrossADaylightSavingBoundary</code> ne vérifie que la présence de deux libellés et le nombre d'éléments; le test resterait vert si le fuseau ou la transition DST étaient ignorés et si les positions/durées étaient erronées - lignes 106-125 - source : lecture intégrale, couverture outillée indisponible - recommandation : Codex assertera les instants locaux projetés, les durées et les positions/relations de chevauchement attendues autour du saut horaire, avec un cas ambigu d'automne en complément."},
  {dim:"tests",sev:"medium",status:"finding",id:"A360-098",file:"tests/OmniEurope.Blazor.Tests/SchedulerComponentTests.cs:49-70-",module:"Tests",size:"",text:"<code>Scheduler_LoadsTheVisibleRangeWithCancellation</code> vérifie seulement que le jeton du chargement initial n'est pas annulé; aucun rechargement concurrent ne prouve l'annulation de la requête précédente - lignes 49-70 - source : lecture intégrale - recommandation : Codex capturera les jetons de deux chargements chevauchés et assertera l'annulation du premier après le déclenchement du second."},
  {dim:"tests",sev:"medium",status:"finding",id:"A360-099",file:"tests/OmniEurope.Blazor.Tests/SelectionComponentTests.cs:53-66-",module:"Tests",size:"",text:"<code>Autocomplete_DebouncesAnnouncesAndSelectsAResult</code> n'émet qu'une seule saisie avant d'attendre le résultat; le test ne peut donc pas prouver le debounce annoncé ni la suppression d'une requête intermédiaire dans la fenêtre configurée - lignes 53-66 - source : lecture intégrale - recommandation : Codex pilotera plusieurs saisies rapprochées avec une temporisation contrôlée et assertera qu'une seule recherche, portant le dernier terme, est lancée après la fenêtre."},
  {dim:"tests",sev:"low",status:"finding",id:"A360-100",file:"samples/OmniEurope.Blazor.Catalog/Components/Routes.razor:1-5-",module:"Catalog",size:"",text:"Le routeur ne fournit aucun contenu <code>NotFound</code> ; une URL inconnue rend une zone principale vide sans titre, explication ni chemin de retour - lignes 1-5 - source : lecture complète du routeur - recommandation : Codex peut ajouter une vue 404 localisée et accessible, distincte des routes paramétrées, puis vérifier sa réponse et son rendu."},
  {dim:"tests",sev:"low",status:"finding",id:"A360-101",file:"src/OmniEurope.Blazor/Components/OmniGridLines.razor:9-",module:"Library",size:"",text:"<code>Count</code> n'est pas validé; une valeur nulle ou négative produit silencieusement une grille vide au lieu d'un contrat explicite - ligne 9 - recommandation: Codex peut imposer une borne positive dans <code>OnParametersSet</code>."},
  {dim:"tests",sev:"low",status:"finding",id:"A360-102",file:"src/OmniEurope.Blazor/wwwroot/omniInterop.js:4-5-",module:"Library",size:"",text:"Le scroll après focus utilise toujours une animation <code>smooth</code> et ignore <code>prefers-reduced-motion</code>, contrairement aux animations CSS déjà neutralisées - lignes 4-5 - recommandation: Codex peut sélectionner <code>auto</code> lorsque la préférence de réduction des mouvements est active."},
  {dim:"tests",sev:"low",status:"finding",id:"A360-103",file:".github/workflows/ci.yml:73-78-",module:"Repository",size:"",text:"Le job Hybrid installe <code>maui-windows</code> sans workload set explicite, alors que <code>global.json</code> autorise <code>latestPatch</code>; les packs construits peuvent donc varier malgré les verrous NuGet - lignes 73-78 - source: <code>AUDIT_DEPENDENCIES.md</code> D-006 - recommandation: Codex peut épingler un workload set compatible, capturer sa version et prouver une restauration reproductible sur le runner Windows."},
  {dim:"tests",sev:"low",status:"finding",id:"A360-104",file:"global.json:2-5-",module:"Repository",size:"",text:"<code>rollForward: latestPatch</code> autorise tout patch installé de la bande <code>10.0.3xx</code>; contrairement au terme « verrouillé » employé dans le README, le SDK exact et les workloads associés peuvent varier entre développeurs et runners - lignes 2-5 - source: <code>AUDIT_DEPENDENCIES.md</code> D-006 et <code>docs/reproducibility.md</code> - recommandation: Codex peut choisir une stratégie reproductible de SDK/workload, documenter explicitement le comportement de roll-forward et enregistrer les versions effectives dans les preuves CI."},
  {dim:"tests",sev:"low",status:"finding",id:"A360-105",file:"tests/OmniEurope.Blazor.Tests/CollectionComponentTests.cs:45-64-",module:"Tests",size:"",text:"<code>PagerAndTree_AreControlledAndKeyboardOperable</code> couvre dans une seule méthode deux composants indépendants, un changement de page, deux sélections d'arbre et l'ARIA; cette agrégation brouille l'Arrange/Act/Assert et rend l'échec moins localisable - lignes 45-64 - source : critère additionnel « un comportement par test » - recommandation : Codex séparera le scénario Pager des scénarios Tree souris, clavier et accessibilité, avec un acte principal et des assertions cohérentes par test."},
  {dim:"tests",sev:"low",status:"finding",id:"A360-106",file:"tests/OmniEurope.Blazor.Tests/FoundationComponentTests.cs:9-137-",module:"Tests",size:"",text:"Quatre tests batchent respectivement 15 composants de fondation, quatre composants de contenu, cinq composants de layout et quatre composants de feedback; un échec ne désigne donc pas directement le composant ou le comportement fautif et plusieurs actes indépendants partagent une seule méthode - lignes 9-137 - source : critère additionnel « un comportement par test » - recommandation : Codex convertira les matrices homogènes en théories nommées par composant et isolera les comportements sémantiques ou les validations qui n'ont pas la même cause d'échec."},
  {dim:"tests",sev:"low",status:"finding",id:"A360-107",file:"tests/OmniEurope.Blazor.Tests/SelectionComponentTests.cs:123-132-",module:"Tests",size:"",text:"<code>LargeSelector_ReloadsAndSelectsTheLastTypedValue</code> ne déclenche aucun rechargement ou rerendu: il vérifie seulement le nombre initial d'options et un changement de sélection - lignes 123-132 - source : lecture intégrale - recommandation : Codex renommera le test selon ce qu'il prouve ou ajoutera un vrai changement de source suivi d'un rerendu et de l'assertion sur la dernière valeur conservée."},
  {dim:"conventions",sev:"high",status:"finding",id:"A360-108",file:".claude/audit/2026-08-11/artefacts/AUDIT_KIT.md:137",size:"",text:"<code>GEN004</code> et <code>GEN008</code> ne sont pas appliqués, et aucun <code>GEN001-GEN008</code> n'est chargé. Aucun <code>.csproj</code> ne référence l'assembly d'analyseurs, aucun <code>.razor</code> n'est exposé comme <code>AdditionalFiles</code>, et <code>.editorconfig</code> ne configure aucune sévérité. Le build vert ne couvre donc pas ces conventions; la présence de blocs <code>@code</code> dans 105/106 fichiers Razor de production en est une preuve observable globale. Recommandation: Codex devra intégrer l'assembly d'analyseurs, câbler les projets applicables, migrer les violations existantes sans désactiver les règles, puis promouvoir les diagnostics applicables jusqu'à l'échec de build exigé par le kit."},
  {dim:"conventions",sev:"high",status:"finding",id:"A360-109",file:".claude/audit/2026-08-11/artefacts/AUDIT_KIT.md:139",size:"",text:"Registre de règles incompatible et sans overlay local. <code>.claude/code-rules.md</code> est absent, alors que <code>STD-RADZEN</code>, <code>STD-BTN</code>, <code>STD-DIALOG</code>, <code>STD-GRID</code>, <code>STD-FORM</code> et <code>STD-TABS</code> décrivent des composants Radzen que ce produit remplace volontairement. L'audit canonique classerait donc le coeur même du produit comme violation, sans contrat Omni équivalent. Recommandation: Codex devra créer un overlay complet et traçable qui conserve les IDs pertinents ou ajoute des IDs Omni dédiés, adapte les recettes de détection aux composants de la bibliothèque et documente chaque exception de portée."},
  {dim:"conventions",sev:"high",status:"finding",id:"A360-110",file:"samples/OmniEurope.Blazor.AutoSmoke.Client/AutoProbe.razor:4-5-",module:"AutoSmokeClient",size:"",text:"<strong>STD-I18N</strong>: les textes visibles <code>OmniEurope.Blazor Interactive Auto</code> et <code>Compteur Auto :</code> sont codés en dur, sans <code>IStringLocalizer&lt;AppStrings&gt;</code> ni contrat local de ressources - lignes 4-5 - source: registre <code>STD-I18N</code> et <code>AUDIT_KIT.md</code> - recommandation: Codex peut définir la localisation adaptée aux samples de la RCL, fournir les clés et ressources par défaut, puis injecter le localizer dans le code-behind; aucune dépendance Radzen n'est nécessaire."},
  {dim:"conventions",sev:"high",status:"finding",id:"A360-111",file:"samples/OmniEurope.Blazor.AutoSmoke.Client/AutoProbe.razor:8-16-",module:"AutoSmokeClient",size:"",text:"Le composant contient toute sa logique dans un bloc <code>@code</code>, contrairement au pattern code-behind <code>.razor</code> + <code>.razor.cs</code> imposé par les standards du kit et non protégé ici par <code>GEN004</code> - lignes 8-16 - source: <code>C:\\Dev\\_Generic\\docs\\coding-standards.md</code>, <code>AUDIT_KIT.md</code> et build sans analyseur <code>GEN004</code> - recommandation: Codex peut déplacer l'état et le gestionnaire dans <code>AutoProbe.razor.cs</code>, sans modifier le contrat de rendu ni introduire Radzen."},
  {dim:"conventions",sev:"high",status:"finding",id:"A360-112",file:"samples/OmniEurope.Blazor.Catalog/Components/Layout/MainLayout.razor:5-",module:"Catalog",size:"",text:"<code>STD-I18N</code> : le libellé visible <code>Catalogue 110/110</code> est codé en dur sans <code>IStringLocalizer&lt;AppStrings&gt;</code> - ligne 5 - source : registre <code>_Generic</code> et <code>AUDIT_KIT.md</code> (infrastructure de localisation absente) - recommandation : Codex peut introduire le contrat de ressources du catalogue et rendre ce libellé localisable, en conservant le nom de produit comme marque."},
  {dim:"conventions",sev:"high",status:"finding",id:"A360-113",file:"samples/OmniEurope.Blazor.Catalog/Components/Pages/Home.razor:120-159-",module:"Catalog",size:"",text:"La logique, les modèles, les données et les callbacks sont maintenus dans un bloc <code>@code</code>, alors que le standard frontend exige un code-behind et que <code>GEN004</code> n'est pas câblé - lignes 120-159 - source : <code>C:\\Dev\\_Generic\\docs\\coding-standards.md</code> et <code>AUDIT_KIT.md</code> - recommandation : Codex peut déplacer ce bloc vers <code>Home.razor.cs</code>, garder uniquement le markup dans la page et câbler <code>GEN004</code> sans suppression."},
  {dim:"conventions",sev:"high",status:"finding",id:"A360-114",file:"samples/OmniEurope.Blazor.Catalog/Components/Pages/Home.razor:4-146-",module:"Catalog",size:"",text:"<code>STD-I18N</code> : la page contient de nombreux titres, libellés, placeholders, messages, labels accessibles et contenus de dialogue/notification codés en dur, sans <code>IStringLocalizer&lt;AppStrings&gt;</code> - lignes 4-146 - source : registre <code>_Generic</code> et <code>AUDIT_KIT.md</code> - recommandation : Codex peut extraire toutes les chaînes humaines vers les ressources du catalogue, y compris les fragments construits en C#, puis ajouter une garde qui échoue sur les chaînes visibles non localisées."},
  {dim:"conventions",sev:"high",status:"finding",id:"A360-115",file:"samples/OmniEurope.Blazor.Catalog/Program.cs:36-42-",module:"Catalog",size:"",text:"<code>STD-PARTIAL</code> : <code>Program</code> est déclaré <code>partial</code> sans consommateur <code>WebApplicationFactory</code>, source-générateur, code-behind ou autre exception autorisée ; le fichier contient aussi le service public <code>CspViolationStore</code>, contrairement à la règle un type par fichier et à la moindre exposition - lignes 36-42 - source : registre <code>_Generic</code> et recherche exhaustive des références - recommandation : Codex peut retirer la déclaration <code>partial</code> tant qu'aucun test d'intégration ne l'exige, déplacer le store dans son propre fichier et le rendre <code>internal</code>."},
  {dim:"conventions",sev:"high",status:"finding",id:"A360-116",file:"samples/OmniEurope.Blazor.HybridSmoke/HybridSmoke.razor:4-5-",module:"HybridSmoke",size:"",text:"<code>STD-I18N</code> : le titre de la sonde et le libellé du bouton sont codés en dur sans <code>IStringLocalizer&lt;AppStrings&gt;</code> - lignes 4-5 - source : registre <code>_Generic</code> et <code>AUDIT_KIT.md</code> (infrastructure de localisation absente) - recommandation : Codex peut ajouter un contrat de ressources adapté au smoke host, conserver <code>OmniEurope.Blazor</code> comme nom de marque et localiser les termes descriptifs et l'action."},
  {dim:"conventions",sev:"high",status:"finding",id:"A360-117",file:"src/OmniEurope.Blazor/Components/OmniAppearanceToggle.razor:20-26-",module:"Library",size:"",text:"Les libellés visibles et l'aria-label sont codés en dur en français au lieu d'un contrat de localisation - lignes 20-26 - règle STD-I18N et infrastructure absente selon AUDIT_KIT.md - recommandation: Codex peut exposer des ressources par défaut localisables et permettre leur surcharge par l'hôte."},

  {dim:"conventions",sev:"high",status:"finding",id:"A360-165",file:"samples/OmniEurope.Blazor.WasmSmoke/App.razor:1,4,6-8-",module:"WasmSmoke",size:"",text:"<code>STD-I18N</code> : le titre de page, le titre principal, le message de succès, le compteur et le libellé de progression sont codés en dur sans <code>IStringLocalizer&lt;AppStrings&gt;</code> - lignes 1, 4, 6-8 - source : registre <code>_Generic</code> et <code>AUDIT_KIT.md</code> (infrastructure de localisation absente) - recommandation : Codex peut ajouter le contrat de ressources propre au smoke host, localiser les chaînes descriptives et conserver <code>OmniEurope.Blazor</code> comme nom de marque."},
  {dim:"conventions",sev:"high",status:"finding",id:"A360-166",file:"samples/OmniEurope.Blazor.WasmSmoke/App.razor:12-20-",module:"WasmSmoke",size:"",text:"La logique d'état et le callback restent dans un bloc <code>@code</code>, alors que le standard frontend exige un fichier code-behind et que <code>GEN004</code> n'est pas câblé - lignes 12-20 - source : <code>C:\\Dev\\_Generic\\docs\\coding-standards.md</code> et <code>AUDIT_KIT.md</code> - recommandation : Codex peut déplacer l'état et le callback vers <code>App.razor.cs</code>, puis câbler <code>GEN004</code> sans suppression."},
  {dim:"conventions",sev:"high",status:"finding",id:"A360-167",file:"samples/OmniEurope.Blazor.WasmSmoke/wwwroot/index.html:6-13-",module:"WasmSmoke",size:"",text:"<code>STD-UIVERIFY</code> : la compatibilité WebAssembly est déclarée au niveau compilation et publication uniquement ; <code>docs/compatibility.md</code> indique explicitement que l'exécution navigateur reste à valider, et le préflight ne fournit aucune preuve visuelle ou console - lignes 6-13 - source : registre <code>_Generic</code>, <code>docs/compatibility.md</code> et <code>metrics/PREFLIGHT.md</code> - recommandation : Codex peut ajouter une vérification navigateur reproductible du chargement, du clic, de la progression, de la console et des violations CSP au pipeline de compatibilité."},
  {dim:"conventions",sev:"medium",status:"finding",id:"A360-168",file:".claude/audit/2026-08-11/artefacts/AUDIT_KIT.md:149",size:"",text:"<code>.editorconfig</code> est une version minimale non alignée. Le fichier diffère sur les fins de ligne, le traitement Markdown et toutes les conventions C# du modèle; il omet aussi les sévérités d'analyseurs. Recommandation: Codex devra fusionner les règles project-neutral du kit, préserver uniquement les divergences explicitement justifiées et faire valider le résultat par un build sans warning."},
  {dim:"conventions",sev:"medium",status:"finding",id:"A360-169",file:"samples/OmniEurope.Blazor.AutoSmoke.Client/AutoProbe.razor:5-",module:"AutoSmokeClient",size:"",text:"<strong>STD-BTN</strong>: le bouton d'action expose un libellé mais aucun pictogramme, alors que la règle adaptée aux boutons Omni exige texte court et icône hors grille - ligne 5 - source: registre <code>STD-BTN</code>; <code>OmniButton</code> accepte un <code>RenderFragment</code>, donc un <code>OmniIcon</code> peut être composé sans Radzen - recommandation: Codex peut ajouter une icône Omni décorative avec le libellé conservé et une sémantique accessible inchangée."},
  {dim:"conventions",sev:"medium",status:"finding",id:"A360-170",file:"samples/OmniEurope.Blazor.Catalog/Components/Pages/Home.razor:145-",module:"Catalog",size:"",text:"<code>STD-DIALOG</code> : le dialogue ouvert par le service n'offre qu'une fermeture par croix, arrière-plan ou Échap et aucune action explicite <code>Fermer</code>/<code>Annuler</code> dans le contenu - ligne 145 - source : appel complet et contrats <code>OmniComponentsHost</code>/<code>OmniDialogRequest</code> - recommandation : Codex peut étendre le contrat Omni de requête avec un pied de dialogue, fournir une action localisée sans effet secondaire et couvrir croix, Échap et bouton explicite, sans réintroduire Radzen."},
  {dim:"conventions",sev:"medium",status:"finding",id:"A360-171",file:"samples/OmniEurope.Blazor.Catalog/Components/Pages/Home.razor:47-48-",module:"Catalog",size:"",text:"<code>STD-BTN</code> : les deux boutons d'action réels <code>Ouvrir le dialogue</code> et <code>Notifier</code> ont du texte mais aucune icône, contrairement à la convention action texte + icône - lignes 47-48 - source : registre <code>_Generic</code> - recommandation : Codex peut composer les boutons Omni avec une icône décorative et un libellé localisé, sans introduire de dépendance Radzen."},
  {dim:"conventions",sev:"medium",status:"finding",id:"A360-172",file:"samples/OmniEurope.Blazor.HybridSmoke/HybridSmoke.razor:5-",module:"HybridSmoke",size:"",text:"<code>STD-BTN</code> : le bouton d'action possède un texte mais aucune icône, contrairement à la convention texte + icône hors grille - ligne 5 - source : registre <code>_Generic</code> - recommandation : Codex peut ajouter une icône décorative adaptée à <code>OmniButton</code> tout en conservant un libellé localisé, sans réintroduire Radzen."},
