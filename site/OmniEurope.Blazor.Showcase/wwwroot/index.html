<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The Content-Security-Policy comes with the response, from the host, not from a meta tag: its
         connect-src must name the showcase API, whose address each deployment sets (wwwroot/_headers for
         a static copy without API, the front container's server for the deployed site). A meta policy
         would also apply, and its fixed connect-src would block the API. -->
    <title>OmniEurope.Blazor</title>
    <base href="/" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="_content/OmniEurope.Blazor/omnieurope.blazor.css" />
    <link rel="stylesheet" href="app.css" />
</head>
<body>
    <div id="app"></div>
    <div id="omni-boot-splash" class="omni-boot-splash" role="status">
        <span class="omni-boot-splash__spinner" aria-hidden="true"></span>
        <span class="omni-visually-hidden">OmniEurope.Blazor</span>
    </div>
    <script src="showcase-theme.js"></script>
    <script src="showcase-culture.js"></script>
    <script src="showcase-layout.js"></script>
    <script src="showcase-demo-store.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
